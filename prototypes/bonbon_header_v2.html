<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon Bon — new header preview</title>
<style>
  :root{--maroon:#811226;--dark:#5a0c1a;--cream:#faf2f1;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
  .phone{width:100%;max-width:430px;background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 0 44px rgba(0,0,0,.5)}

  /* ---- wooden shopfront header ---- */
  .hdr{position:relative;padding:20px 12px 22px;display:flex;align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(2deg, rgba(80,50,20,.10) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(180deg, #c6a06e 0px, #c39c69 26px, #6f5030 26px, #6f5030 29px),
      linear-gradient(180deg,#caa570,#a67c48);
    box-shadow:inset 0 -8px 16px rgba(0,0,0,.28), inset 0 6px 12px rgba(255,255,255,.08);
  }
  .hdr .logo{width:180px;max-width:60%;display:block;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 13px rgba(255,255,255,.55)) drop-shadow(0 3px 5px rgba(0,0,0,.45));
  }
  .langpill{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:linear-gradient(135deg,var(--maroon),var(--dark));color:#fff;border:0;cursor:pointer;
    border-radius:22px;padding:9px 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;
    box-shadow:0 3px 9px rgba(0,0,0,.4);}
  .langpill svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- scalloped striped awning ---- */
  .awning{height:34px;background:repeating-linear-gradient(90deg,var(--maroon) 0 26px,var(--cream) 26px 52px);
    box-shadow:0 3px 7px rgba(0,0,0,.22)}
  .scallop{height:15px;background:repeating-linear-gradient(90deg,var(--maroon) 0 26px,var(--cream) 26px 52px);
    -webkit-mask:radial-gradient(circle 13px at 13px 0, #000 12px, transparent 13px) repeat-x;
    -webkit-mask-size:26px 15px; mask:radial-gradient(circle 13px at 13px 0, #000 12px, transparent 13px) repeat-x; mask-size:26px 15px;}

  /* ---- a little chat below, for context ---- */
  .chat{padding:20px 16px 8px;background:var(--cream)}
  .row{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--maroon),var(--dark));flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:17px}
  .bub{background:#fff;border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:14.5px;color:#2a1212;box-shadow:0 1px 4px rgba(0,0,0,.06);line-height:1.4}
  .foot{text-align:center;font-size:11px;color:#9a8585;padding:10px}
</style></head>
<body>
  <div class="phone">
    <div class="hdr">
      <img class="logo" src="https://odysra.com/bon_bon_logo.png" alt="Bon Bon Ice Creams">
      <button class="langpill">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>
        EN
        <svg viewBox="0 0 24 24" style="width:13px"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="awning"></div>
    <div class="scallop"></div>

    <div class="chat">
      <div class="row"><div class="av">🍦</div><div class="bub">Hi! 🍦 Welcome to Bon Bon Ice Creams — what are you craving today?</div></div>
      <div class="row"><div class="av">🍦</div><div class="bub">Here are some of our favourites 🍨👇</div></div>
    </div>
    <div class="foot">Demo prototype · simulated AI &amp; payment · © Odysra</div>
  </div>
</body></html>
