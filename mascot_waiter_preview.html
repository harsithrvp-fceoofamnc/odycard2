<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Odysra — AI Waiter · VIT</title>
<!--
  DROP THESE FILES NEXT TO THIS HTML (all optional — CSS fallbacks render until they exist):
    mascot.png           neutral Odysra mascot (white shirt, black trousers)
    mascot_dvour.png     mascot in D'VOUR outfit
    mascot_kimchi.png    mascot in Kimchi & Ramen outfit
    mascot_bonbon.png    mascot in Bon Bon outfit
    stall_dvour.png      D'VOUR kiosk render
    stall_kimchi.png     Kimchi & Ramen kiosk render
    stall_bonbon.png     Bon Bon kiosk render
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08080a;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
.serif{font-family:Georgia,"Times New Roman",serif}
.app{max-width:440px;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:#100c0e;
  box-shadow:0 0 60px rgba(0,0,0,.75)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  transition:opacity .5s ease}
.screen.on{opacity:1;pointer-events:auto}

/* ============ 1 · FOOD COURT ============ */
#s1{background:radial-gradient(ellipse at 50% -10%,#2e2029,#100c0e 72%)}
.top1{padding:24px 22px 0;text-align:center}
.top1 .k{font-size:9px;letter-spacing:.3em;color:#8b7480}
.top1 h1{font-size:23px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-top:7px;line-height:1.25}
.hostrow{display:flex;align-items:flex-end;gap:10px;padding:12px 18px 4px}
.host{height:126px;flex:0 0 auto;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-.7deg)}}
.hostph{height:126px;width:64px;flex:0 0 auto;border:1.5px dashed #4b3944;border-radius:12px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:8px;color:#6d5561;text-align:center}
.bub{background:#fff;border-radius:17px;border-bottom-left-radius:5px;padding:12px 14px;font-size:13.5px;
  line-height:1.5;color:#22181d;margin-bottom:14px;animation:pop .45s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.94)}to{opacity:1;transform:none}}
.picks{flex:1;padding:6px 18px 20px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.stall{position:relative;height:108px;border-radius:19px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:transform .22s;animation:up .5s cubic-bezier(.2,.8,.2,1) both;background-size:cover;background-position:center}
.stall:active{transform:scale(.975)}
@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.stall .k2{font-size:8px;letter-spacing:.24em;position:relative;z-index:3}
.stall .n2{position:relative;z-index:3;margin-top:5px;line-height:1}
.stall .t2{font-size:7.5px;letter-spacing:.18em;position:relative;z-index:3;margin-top:7px}

/* ---- stall skins (fallback art until real renders drop in) ---- */
.sk-dvour{background-image:url('stall_dvour.png'),
  radial-gradient(ellipse at 50% 38%,#242424,#0c0c0c 78%)}
.sk-dvour:after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,196,0,.16),transparent 68%)}
.sk-dvour .fr{position:absolute;inset:7px;border:1.5px solid #ffc400;border-radius:2px;opacity:.75;z-index:2}
.sk-dvour .k2{color:#c9a233}
.sk-dvour .n2{font-size:23px;color:#fff;letter-spacing:.07em;border:2px solid #ffc400;padding:4px 14px}
.sk-dvour .t2{color:#ffc400}

.sk-kimchi{background-image:url('stall_kimchi.png'),
  radial-gradient(ellipse at 50% 36%,#d8253a,#8e0f20 82%)}
.sk-kimchi:after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(58deg,rgba(255,255,255,.07) 0 2px,transparent 2px 26px),
             repeating-linear-gradient(-58deg,rgba(255,255,255,.05) 0 2px,transparent 2px 31px)}
.sk-kimchi .seal{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:19px;height:19px;
  border-radius:50%;background:#fff;z-index:3}
.sk-kimchi .k2{color:#ffd9dd;margin-top:20px}
.sk-kimchi .n2{font-size:19px;color:#fff}
.sk-kimchi .t2{background:#fff;color:#c8102e;padding:2px 8px;font-weight:800}

.sk-bonbon{background-image:url('stall_bonbon.png'),
  repeating-linear-gradient(93deg,rgba(0,0,0,.2) 0 1px,transparent 1px 5px),
  linear-gradient(165deg,#6d4023,#3a1e0e)}
.sk-bonbon:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,214,170,.2),transparent 66%)}
.sk-bonbon .awn{position:absolute;top:0;left:0;right:0;height:15px;z-index:2;
  background:repeating-linear-gradient(90deg,#fbeef1 0 15px,#8a1530 15px 30px)}
.sk-bonbon .k2{color:#f0c9d3}.sk-bonbon .n2{font-size:26px;color:#fff}.sk-bonbon .t2{color:#fbeef1}

/* ============ ZOOM LAYER ============ */
#zoom{position:absolute;z-index:80;overflow:hidden;pointer-events:none;opacity:0;background-size:cover;background-position:center}

/* ============ 2 · WELCOME ============ */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:filter .55s ease,transform .55s ease}
.bg.blur{filter:blur(17px) brightness(.6);transform:scale(1.1)}
.w2{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding:0 20px 30px;transition:opacity .4s ease,transform .5s ease}
.w2.gone{opacity:0;transform:translateY(26px)}
.wbub{background:rgba(255,255,255,.97);border-radius:20px;padding:15px 18px;text-align:center;
  max-width:292px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .5s .35s cubic-bezier(.2,.9,.3,1.25) both}
.wbub .h{font-size:17px;font-weight:800;color:#1b1418;letter-spacing:-.01em}
.wbub .p{font-size:13px;color:#77686e;line-height:1.55;margin-top:6px}
.dressed{height:272px;margin-bottom:-6px;animation:enter .72s cubic-bezier(.2,.9,.3,1.15) both}
.dressedph{height:230px;width:118px;border:1.5px dashed rgba(255,255,255,.45);border-radius:16px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-size:9.5px;
  color:rgba(255,255,255,.65);text-align:center;line-height:1.5;
  animation:enter .72s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes enter{from{opacity:0;transform:translateY(58px) scale(.9)}to{opacity:1;transform:none}}
.cont{margin-top:17px;width:100%;max-width:292px;border:0;border-radius:15px;padding:15px;
  font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;
  animation:pop .5s .5s cubic-bezier(.2,.9,.3,1.25) both;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.cont:active{transform:scale(.97)}
.back{position:absolute;top:16px;left:16px;z-index:9;width:36px;height:36px;border:0;border-radius:50%;
  background:rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#fff;font-size:17px;cursor:pointer}

/* ============ 3 · CHAT (glass) ============ */
.glass{position:absolute;left:0;right:0;bottom:0;top:58px;z-index:6;
  background:rgba(255,255,255,.86);backdrop-filter:blur(26px) saturate(1.4);
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;
  border-top:1px solid rgba(255,255,255,.75);box-shadow:0 -14px 46px rgba(0,0,0,.34);
  transform:translateY(102%);transition:transform .58s cubic-bezier(.2,.85,.25,1)}
.glass.up{transform:translateY(0)}
.ghdr{flex:0 0 auto;padding:13px 16px 11px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(0,0,0,.06)}
.gav{width:34px;height:34px;border-radius:11px;flex:0 0 auto;overflow:hidden;display:flex;
  align-items:flex-end;justify-content:center;background:rgba(0,0,0,.06)}
.gav img{width:150%;margin-bottom:-12%}
.ghdr .gt b{display:block;font-size:14px;font-weight:700;color:#16131a;line-height:1.2}
.ghdr .gt span{font-size:10.5px;color:#0e7a55;font-weight:600}
.gclose{margin-left:auto;width:31px;height:31px;border:0;border-radius:50%;background:rgba(0,0,0,.05);
  color:#6c7280;font-size:15px;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:15px 15px 6px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.row{display:flex;gap:9px;margin-bottom:13px}
.rav{width:27px;height:27px;border-radius:9px;flex:0 0 auto;overflow:hidden;background:rgba(0,0,0,.06);
  display:flex;align-items:flex-end;justify-content:center}
.rav img{width:155%;margin-bottom:-14%}
.msg{background:#fff;border-radius:16px;border-top-left-radius:5px;padding:12px 14px;font-size:14px;
  line-height:1.55;color:#1d1f25;box-shadow:0 1px 3px rgba(20,20,40,.08);max-width:84%;
  animation:up .42s cubic-bezier(.2,.8,.2,1) both}
.you{border-radius:16px;border-top-right-radius:5px;padding:11px 14px;font-size:13.5px;
  margin:0 0 13px auto;width:fit-content;max-width:80%;animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.dots{display:flex;gap:5px;padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:#c8ccd4;animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.cards{display:flex;gap:9px;overflow-x:auto;padding:2px 15px 12px;margin:0 -15px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 148px;background:#fff;border-radius:15px;overflow:hidden;
  box-shadow:0 1px 3px rgba(20,20,40,.08),0 8px 20px rgba(20,20,40,.07);
  animation:up .48s cubic-bezier(.2,.8,.2,1) both}
.card .im{height:64px;display:flex;align-items:center;justify-content:center;font-size:29px}
.card .bd{padding:9px 10px 10px}
.card .nm{font-size:12px;font-weight:700;color:#16131a;line-height:1.32;height:31px;overflow:hidden}
.card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.card .pr{font-size:13.5px;font-weight:800;color:#16131a}
.add{border:0;border-radius:20px;padding:6px 11px;font-size:10.5px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:.15s}
.add:active{transform:scale(.92)}
.add.on{background:#0e7a55 !important;color:#fff !important}
.comp{flex:0 0 auto;border-top:1px solid rgba(0,0,0,.06);padding:9px 12px calc(11px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(0,0,0,.09);background:rgba(255,255,255,.7);border-radius:20px;
  padding:8px 13px;font-size:12.5px;font-weight:600;color:#41454d;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:active{transform:scale(.95)}
.inrow{display:flex;gap:7px;align-items:center}
.inrow input{flex:1;border:1px solid rgba(0,0,0,.1);border-radius:22px;padding:11px 15px;font-size:14.5px;
  font-family:inherit;background:rgba(255,255,255,.75);color:#16131a;outline:none;min-width:0}
.ib{width:40px;height:40px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.cart{position:absolute;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:20;
  background:#16171a;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px;
  transition:.34s cubic-bezier(.2,.85,.25,1);box-shadow:0 12px 30px rgba(0,0,0,.34)}
.cart.hide{transform:translateY(230%);opacity:0}
.cart .c{flex:1;color:#fff}.cart .c b{font-size:13.5px;display:block}
.cart .c span{font-size:10px;color:#9a9ca3}
.cart button{border:0;border-radius:9px;background:#fff;color:#16171a;padding:9px 15px;font-size:12.5px;
  font-weight:800;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 1 · FOOD COURT ============ -->
  <div class="screen on" id="s1">
    <div class="top1">
      <div class="k">ODYSRA · VIT VELLORE</div>
      <h1>Which menu shall we explore?</h1>
    </div>
    <div class="hostrow">
      <img class="host" src="mascot.png" alt="" onerror="this.outerHTML='<div class=hostph>mascot<br>.png</div>'">
      <div class="bub">Welcome! 👋 Three stalls open tonight — pick one and I'll take you in.</div>
    </div>
    <div class="picks" id="picks"></div>
  </div>

  <div id="zoom"></div>

  <!-- ============ 2 · WELCOME ============ -->
  <div class="screen" id="s2">
    <div class="bg" id="bg2"></div>
    <button class="back" onclick="backHome()">←</button>
    <div class="w2" id="w2"></div>
  </div>

  <!-- ============ 3 · CHAT ============ -->
  <div class="screen" id="s3">
    <div class="bg blur" id="bg3"></div>
    <div class="glass" id="glass">
      <div class="ghdr">
        <div class="gav" id="gav"></div>
        <div class="gt"><b id="gname"></b><span>AI Waiter · online</span></div>
        <button class="gclose" onclick="backHome()">✕</button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="cart hide" id="cart">
        <div class="c"><b id="cn">0 items</b><span>tap to review your order</span></div>
        <button>View cart</button>
      </div>
      <div class="comp">
        <div class="chips" id="chips"></div>
        <div class="inrow">
          <input id="inp" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter')ask(this.value)">
          <button class="ib" id="micb" onclick="ask('Recommend for me')" aria-label="Speak">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6c7280" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="ib" id="sendb" onclick="ask(document.getElementById('inp').value)" aria-label="Send">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5.5l6.5 6.5-6.5 6.5"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const T={
 dvour:{
   name:"D'VOUR", tag:"SAVOUR THE SPEED", no:"STALL 01",
   c:"#ffc400", ink:"#1a1a1a", onC:"#1a1a1a",
   skin:"sk-dvour", deco:'<div class="fr"></div>', nameCls:"",
   mascot:"mascot_dvour.png", stall:"stall_dvour.png",
   hi:"Welcome to D'VOUR!", sub:"Burgers, wings and loaded fries 🍔 Tell me how hungry you are.",
   chips:["Recommend for me","Bestsellers","Something spicy","Under ₹200"],
   items:{korean:{n:"Korean Burger",p:230,e:"🍔"}, nash:{n:"Nashville Chicken Burger",p:250,e:"🍗"},
     fries:{n:"Cheesy French Fries",p:150,e:"🍟"}, wings:{n:"Buffalo Wings",p:220,e:"🔥"},
     dunk:{n:"Cheese Dunk Burger",p:270,e:"🧀"}, mex:{n:"Mexican Rice (Veg)",p:180,e:"🌮"}},
   a:{"Recommend for me":{r:"First time? Korean Burger, no debate 🍔 Kimchi crunch and gochujang mayo.",ids:["korean","fries","wings"]},
      "Bestsellers":{r:"These three go out fastest all night 🔥",ids:["korean","nash","fries"]},
      "Something spicy":{r:"Proper heat, in order of intensity 🌶️",ids:["nash","wings","korean"]},
      "Under ₹200":{r:"Big flavour, smaller bill 😎",ids:["fries","mex","wings"]}}},

 kimchi:{
   name:"Kim Chi & Ramen", tag:"INDO ASIAN FOOD", no:"STALL 02",
   c:"#c8102e", ink:"#c8102e", onC:"#ffffff",
   skin:"sk-kimchi", deco:'<div class="seal"></div>', nameCls:"",
   mascot:"mascot_kimchi.png", stall:"stall_kimchi.png",
   hi:"Welcome to Kim Chi & Ramen!", sub:"Ramen, bao and momos 🍜 Everything here goes out hot and fresh.",
   chips:["Recommend for me","Bestsellers","Something spicy","Veg only"],
   items:{ramen:{n:"Paneer Ramen",p:220,e:"🍜"}, momos:{n:"Korean Veg Momos",p:150,e:"🥟"},
     krice:{n:"Kimchi Rice",p:220,e:"🍚"}, bao:{n:"Paneer Bao Classic",p:160,e:"🥖"},
     honey:{n:"Honey Paneer",p:220,e:"🍯"}, nasi:{n:"Nasi Goreng",p:240,e:"🍛"}},
   a:{"Recommend for me":{r:"Paneer Ramen — that's the one people come back for 🍜",ids:["ramen","momos","bao"]},
      "Bestsellers":{r:"Tonight's top three, in order 🥟",ids:["ramen","momos","krice"]},
      "Something spicy":{r:"Kimchi Rice has the real kick 🌶️",ids:["krice","ramen","honey"]},
      "Veg only":{r:"All veg, all good 🌱",ids:["ramen","bao","honey"]}}},

 bonbon:{
   name:"Bon Bon", tag:"BUTTER CRAFTED ICE CREAMS", no:"STALL 03",
   c:"#8a1530", ink:"#8a1530", onC:"#ffffff",
   skin:"sk-bonbon", deco:'<div class="awn"></div>', nameCls:"serif",
   mascot:"mascot_bonbon.png", stall:"stall_bonbon.png",
   hi:"Welcome to Bon Bon!", sub:"Cold, sweet and made to order 🍨 What are you in the mood for?",
   chips:["Recommend for me","Bestsellers","Something chocolatey","Under ₹150"],
   items:{dbc:{n:"Death by Chocolate",p:160,e:"🍫"}, waffle:{n:"Belgian Waffle with Ice Cream",p:150,e:"🧇"},
     mango:{n:"Alphonso Mango Scoop",p:90,e:"🥭"}, kesar:{n:"Kesar Badam & Pista",p:120,e:"🍦"},
     brownie:{n:"Hot Brownie Sizzler",p:210,e:"🍮"}, shake:{n:"Thick Chocolate Shake",p:140,e:"🥤"}},
   a:{"Recommend for me":{r:"You look like a chocolate person 😄 Death by Chocolate — most people order it twice.",ids:["dbc","brownie","shake"]},
      "Bestsellers":{r:"These outsell everything else on the board tonight 🍨",ids:["dbc","waffle","kesar"]},
      "Something chocolatey":{r:"Say no more. 🍫 Deepest chocolate we have, in order.",ids:["dbc","brownie","shake"]},
      "Under ₹150":{r:"Light on the wallet, still proper dessert 😋",ids:["mango","kesar","shake"]}}}
};

const $=i=>document.getElementById(i);
let cur=null, cart={}, busy=false;
const money=n=>"₹"+n;
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.keys(cart).reduce((t,k)=>t+cart[k]*T[cur].items[k].p,0);

/* ---------- 1 · food court ---------- */
$("picks").innerHTML=Object.keys(T).map(k=>{
  const t=T[k];
  return `<div class="stall ${t.skin}" data-k="${k}" onclick="zoomInto('${k}')">
    ${t.deco}<div class="k2">${t.no}</div>
    <div class="n2 ${t.nameCls}">${t.name}</div>
    <div class="t2">${t.tag}</div></div>`;
}).join("");
[...document.querySelectorAll(".stall")].forEach((el,i)=>el.style.animationDelay=(.08+i*.09)+"s");

/* ---------- zoom into the stall ---------- */
function zoomInto(k){
  cur=k; cart={}; const t=T[k];
  const el=document.querySelector('.stall[data-k="'+k+'"]');
  const r=el.getBoundingClientRect(), a=document.querySelector(".app").getBoundingClientRect();
  const z=$("zoom");
  z.className=t.skin; z.innerHTML=t.deco;
  z.style.cssText=`position:absolute;z-index:80;overflow:hidden;border-radius:19px;
    left:${r.left-a.left}px;top:${r.top-a.top}px;width:${r.width}px;height:${r.height}px;opacity:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:all .62s cubic-bezier(.5,0,.2,1)`;
  $("s1").classList.remove("on");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    z.style.left="0px"; z.style.top="0px";
    z.style.width=a.width+"px"; z.style.height=a.height+"px"; z.style.borderRadius="0px";
  }));
  setTimeout(()=>showWelcome(k),560);
}

/* ---------- 2 · personalised welcome ---------- */
function showWelcome(k){
  const t=T[k];
  $("bg2").className="bg "+t.skin;
  $("bg2").innerHTML=t.deco;
  $("w2").className="w2";
  $("w2").innerHTML=`
    <img class="dressed" src="${t.mascot}" alt=""
      onerror="this.outerHTML='<div class=dressedph>${t.mascot}<br>goes here</div>'">
    <div class="wbub"><div class="h">${t.hi}</div><div class="p">${t.sub}</div></div>
    <button class="cont" style="background:${t.c};color:${t.onC}" onclick="toChat()">Continue →</button>`;
  $("s2").classList.add("on");
  setTimeout(()=>{ $("zoom").style.opacity="0"; },90);
}
function backHome(){
  $("s2").classList.remove("on"); $("s3").classList.remove("on");
  $("glass").classList.remove("up"); $("zoom").style.opacity="0";
  cart={}; $("cart").classList.add("hide");
  setTimeout(()=>$("s1").classList.add("on"),140);
}

/* ---------- glass transition ---------- */
function toChat(){
  const t=T[cur];
  $("w2").classList.add("gone");
  $("bg2").classList.add("blur");
  setTimeout(()=>{
    $("bg3").className="bg blur "+t.skin;
    $("bg3").innerHTML=t.deco;
    $("gname").textContent=t.name;
    $("gav").innerHTML=`<img src="${t.mascot}" onerror="this.remove()">`;
    $("sendb").style.background=t.c;
    $("sendb").querySelector("svg").setAttribute("stroke",t.onC);
    $("micb").style.background="rgba(0,0,0,.05)";
    $("chips").innerHTML=t.chips.map(c=>`<button class="chip" onclick="ask('${c}')">${c}</button>`).join("");
    $("chat").innerHTML=`<div class="row"><div class="rav"><img src="${t.mascot}" onerror="this.remove()"></div>
      <div class="msg">${t.sub} Tap something below or just tell me. 😊</div></div>`;
    $("s3").classList.add("on");
    $("s2").classList.remove("on");
    setTimeout(()=>$("glass").classList.add("up"),70);
  },380);
}

/* ---------- 3 · chat ---------- */
function card(id,d){
  const t=T[cur], m=t.items[id];
  return `<div class="card" style="animation-delay:${d}s">
    <div class="im" style="background:${t.c}1f">${m.e}</div>
    <div class="bd"><div class="nm">${m.n}</div>
      <div class="ft"><span class="pr">${money(m.p)}</span>
      <button class="add" style="background:${t.c};color:${t.onC}" onclick="addItem('${id}',this)">Add</button></div></div></div>`;
}
function ask(q){
  q=(q||"").trim(); if(!q||busy)return;
  busy=true; const t=T[cur], box=$("chat");
  box.insertAdjacentHTML("beforeend",`<div class="you" style="background:${t.c};color:${t.onC}">${q}</div>`);
  $("inp").value="";
  box.insertAdjacentHTML("beforeend",
    `<div class="row" id="tp"><div class="rav"><img src="${t.mascot}" onerror="this.remove()"></div>
     <div class="msg"><div class="dots"><i></i><i></i><i></i></div></div></div>`);
  box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    const keys=Object.keys(t.a);
    const a=t.a[t.a[q]?q:keys[0]];
    $("tp").remove();
    box.insertAdjacentHTML("beforeend",
      `<div class="row"><div class="rav"><img src="${t.mascot}" onerror="this.remove()"></div>
       <div class="msg">${a.r}</div></div>
       <div class="cards">${a.ids.map((id,i)=>card(id,i*.07)).join("")}</div>`);
    box.scrollTop=box.scrollHeight;
    busy=false;
  },820);
}
function addItem(id,btn){
  cart[id]=(cart[id]||0)+1;
  btn.textContent="Added ✓";btn.classList.add("on");
  setTimeout(()=>{btn.textContent="Add";btn.classList.remove("on")},800);
  $("cn").textContent=count()+(count()===1?" item · ":" items · ")+money(total());
  $("cart").classList.remove("hide");
}
</script>
