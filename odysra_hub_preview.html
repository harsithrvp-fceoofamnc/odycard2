<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odysra — gate & hub preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,sans-serif;background:#f4f5f7;color:#15171c}
.switch{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;background:#fff;border:1px solid #e7e9ee;padding:5px;border-radius:999px;box-shadow:0 4px 14px rgba(17,19,24,.08)}
.switch button{border:0;background:transparent;color:#6b7280;font:inherit;font-weight:700;font-size:13px;padding:8px 18px;border-radius:999px;cursor:pointer}
.switch button.on{background:#15171c;color:#fff}
.view{display:none}.view.show{display:block}
.logoimg{object-fit:contain;display:block}
.word{font-weight:800;letter-spacing:4px;color:#15171c}

/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 600px at 50% -10%,#fff,#f4f5f7 70%)}
.gcard{width:368px;max-width:100%;padding:40px 32px 26px;text-align:center;border-radius:20px;background:#fff;border:1px solid #e7e9ee;box-shadow:0 24px 60px rgba(17,19,24,.10)}
.gcard .logoimg{width:62px;height:62px;margin:0 auto 12px}
.gcard .word{font-size:22px;letter-spacing:5px}
.tag{font-size:12.5px;color:#8a909c;margin:6px 0 30px}
.lab{font-size:13px;color:#4b5160;margin-bottom:12px}
.pin{width:100%;text-align:center;font-size:28px;letter-spacing:14px;padding:13px 10px;border-radius:12px;border:1.5px solid #e1e4ea;background:#fbfbfc;color:#15171c;outline:none}
.pin:focus{border-color:#2f6fed;box-shadow:0 0 0 4px rgba(47,111,237,.12);background:#fff}
.unlock{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;color:#fff;background:#15171c;box-shadow:0 8px 20px rgba(17,19,24,.18)}
.foot{font-size:11px;color:#a2a8b4;margin-top:22px}

/* hub */
.hub{min-height:100vh;padding:30px 18px 60px;background:radial-gradient(900px 560px at 50% -8%,#fff,#f4f5f7 72%)}
.head{max-width:880px;margin:0 auto 26px}.brand{display:flex;align-items:center;gap:13px}
.head .logoimg{width:46px;height:46px}.head .word{font-size:21px}
.sub{font-size:12.5px;color:#8a909c;margin-top:2px}
.wrap{max-width:880px;margin:0 auto}.sec{margin-bottom:26px}
.seclab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#6b7280;margin:0 2px 12px}
.sq{width:9px;height:9px;border-radius:3px;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.card{position:relative;display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #e7e9ee;box-shadow:0 1px 2px rgba(17,19,24,.04);transition:transform .18s,box-shadow .22s,border-color .22s;cursor:pointer}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:0;transition:opacity .2s}
.card:hover{transform:translateY(-2px);border-color:#d3d7df;box-shadow:0 12px 26px rgba(17,19,24,.10)}
.card:hover .bar{opacity:1}
.ct{flex:1;min-width:0}.t{font-size:15.5px;font-weight:700}.s{font-size:12px;color:#8a909c;margin-top:2px}
.arr{color:#b6bcc7;font-size:18px;transition:transform .2s,color .2s}.card:hover .arr{transform:translateX(4px);color:var(--c)}
.footer{text-align:center;color:#a2a8b4;font-size:11.5px;margin-top:30px}
</style></head><body>
<div class="switch"><button id="tg" class="on" onclick="show('gate')">Password screen</button><button id="th" onclick="show('hub')">Hub</button></div>
