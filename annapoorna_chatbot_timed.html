  :root{--blue:#2645A8;--ink:#23262b;--mut:#7b8190;--line:#e7e2d6;--cream:#f6f1e6;--gold:#d9a93c;--card:#ffffff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0e1116;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
  #phone{width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--cream);overflow:hidden;display:flex;flex-direction:column;position:relative}
  @media(min-width:480px){
    body{padding:16px;box-sizing:border-box}
    #phone{height:calc(100dvh - 32px);max-height:820px;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  }
  header{background:var(--blue);color:#fff;padding:12px 16px 10px;display:flex;align-items:center;gap:10px}
  header .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:11px;opacity:.85;margin-top:1px}
  header .hback{background:rgba(255,255,255,.16);border:0;color:#fff;width:32px;height:32px;border-radius:9px;font-size:18px;line-height:1;cursor:pointer;flex:0 0 auto;display:none}
  .langbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#1f3c93}
  .langbar::-webkit-scrollbar{display:none}
  .lang{flex:0 0 auto;font-size:12px;color:#dfe6ff;background:rgba(255,255,255,.12);border:0;padding:5px 11px;border-radius:20px;cursor:pointer}
  .lang.on{background:#fff;color:var(--blue);font-weight:700}
  #chat{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
  .wmark{align-self:center;text-align:center;margin-top:auto;padding-top:20px;padding-bottom:6px}
  .wmark img{width:155px}
  .wmark .cap{font-size:10.5px;color:var(--mut);letter-spacing:2px;margin-top:8px;text-transform:uppercase}
  #wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;opacity:.05}
  #wm img{width:250px}
  .msg{max-width:88%;font-size:13.5px;line-height:1.45;padding:10px 13px;border-radius:15px}
  .bot{align-self:flex-start;background:#fff;color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:5px}
  .me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
  .msg,.dish,.pair{animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px;align-items:center}
  .typing .dot{width:6px;height:6px;border-radius:50%;background:#bdb4a2;display:inline-block;animation:blink 1.2s infinite}
  .typing .dot:nth-child(2){animation-delay:.2s}
  .typing .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .outlet{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-self:stretch;padding:2px}
  .outlet button{background:#fff;border:1.4px solid var(--blue);color:var(--blue);font-weight:700;padding:15px 8px;border-radius:13px;font-size:13.5px;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-self:stretch;padding:2px}
  .dish{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .dish .pic{height:74px;background:#f0ead9;display:flex;align-items:center;justify-content:center;font-size:34px}
  .dish .bd{padding:8px 9px;display:flex;flex-direction:column;gap:3px;flex:1}
  .dish .nm{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25;min-height:2.1em;overflow-wrap:anywhere}
  .dish .pr{font-size:12px;color:var(--blue);font-weight:700}
  .dish .tag{font-size:9.5px;color:var(--gold);font-weight:700}
  .frow{display:flex;gap:5px;margin-top:auto;align-items:center}
  .add{flex:1;border:1.4px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:12px;padding:6px;border-radius:9px;cursor:pointer}
  .add.in{background:var(--blue);color:#fff}
  .qtys{flex:1;display:flex;align-items:center;justify-content:space-between;border:1.4px solid var(--blue);border-radius:9px;padding:1px 4px}
  .qtys button{width:26px;height:24px;border:0;background:transparent;color:var(--blue);font-size:17px;font-weight:800;cursor:pointer;line-height:1}
  .qtys span{font-size:13px;font-weight:800;color:var(--ink)}
  .infob{border:1.3px solid var(--line);background:#fff;color:var(--blue);font-size:13px;padding:6px 8px;border-radius:9px;cursor:pointer}
  .noteb{border:1.3px solid var(--line);background:#fff;color:var(--mut);font-size:13px;padding:5px 8px;border-radius:9px;cursor:pointer}
  .noteb.has{border-color:var(--gold);color:#b8860b;background:#fff7e6}
  .chips{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;max-width:100%}
  .chip{font-size:12.5px;background:#fff;border:1.3px solid var(--blue);color:var(--blue);padding:7px 12px;border-radius:20px;cursor:pointer;font-weight:600}
  .chip.alt{border-color:var(--line);color:var(--ink)}
  .chip.go{background:var(--blue);color:#fff}
  .pair{align-self:stretch;background:#fff7e6;border:1px solid #f0dca8;border-radius:14px;padding:10px 11px}
  .pair p{margin:0 0 8px;font-size:13px;color:#6b541a}
  .pair .row{display:flex;gap:8px}
  .pair .pi{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center}
  .pair .pi .e{font-size:24px}.pair .pi .n{font-size:11px;font-weight:700;margin:2px 0}
  .barwrap{border-top:1px solid var(--line);background:var(--cream);padding:8px 10px 10px}
  #cartbar{display:none;width:100%;background:var(--gold);color:#3a2a05;border:0;font-weight:800;font-size:13.5px;padding:11px;border-radius:12px;cursor:pointer;margin-bottom:8px}
  .inputrow{display:flex;gap:7px;align-items:center}
  .inputrow input{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 13px;font-size:13.5px;outline:none}
  .mic{background:#fff;border:1px solid var(--line);color:var(--blue);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
  .mic.on{background:#e53935;color:#fff;border-color:#e53935;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .send{background:var(--blue);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
  .foot{text-align:center;font-size:9.5px;color:var(--mut);padding:5px}
  #modal{position:absolute;inset:0;background:rgba(20,16,10,.45);display:none;align-items:flex-end;z-index:9}
  .sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px 20px}
  .sheet h2{margin:2px 0 12px;font-size:17px;color:var(--ink)}
  .ci{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .ci .e{font-size:24px}.ci .g{flex:1}.ci .g .n{font-size:13.5px;font-weight:700}.ci .g .p{font-size:12px;color:var(--mut)}
  .ci .g .cnote{font-size:11px;color:#b8860b;margin-top:2px;font-style:italic}
  .rc{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rc .e{font-size:22px}
  .rc .rg{flex:1}.rc .rn{font-size:13px;font-weight:700;color:var(--ink)}.rc .rp{font-size:12px;color:var(--blue);font-weight:700}
  .radd{flex:0 0 auto;border:1.4px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:12px;padding:7px 15px;border-radius:9px;cursor:pointer}
  .recohd{margin:16px 0 4px;font-weight:700;font-size:14px;color:var(--ink)}
  .qty{display:flex;align-items:center;gap:9px}
  .qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--blue);font-weight:800}
  .tot{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--ink)}
  .tot.big{font-size:16px;font-weight:800;border-top:2px solid var(--line);margin-top:6px;padding-top:9px}
  .btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;font-weight:700;font-size:14.5px;padding:12px;border-radius:12px;cursor:pointer;margin-top:12px}
  .btn.g{background:var(--gold);color:#3a2a05}
  .opt{display:flex;gap:10px;margin:6px 0 2px}
  .opt button{flex:1;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;padding:14px;border-radius:12px;cursor:pointer;font-size:14px}
  .opt button.on{background:var(--blue);color:#fff}
  .fld{margin:9px 0}
  .fld label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
  .fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;outline:none;font-family:inherit}
  .note{font-size:11.5px;color:var(--mut);background:#f3eee3;border-radius:9px;padding:8px 10px;margin-top:8px}
  .ok{text-align:center;padding:14px 4px}
  .ok .big{font-size:46px}.ok h2{margin:8px 0 4px}.ok p{color:var(--mut);font-size:13px;margin:4px 0}
</style>

 kesari:{en:"Sweet semolina pudding with ghee and cashews.",ta:"நெய், முந்திரியுடன் இனிப்பான ரவா கேசரி.",hi:"घी और काजू के साथ मीठा रवा केसरी।",ml:"നെയ്യും കശുവണ്ടിയും ചേർത്ത മധുര റവ കേസരി.",te:"నెయ్యి, జీడిపప్పుతో తీపి రవ్వ కేసరి.",kn:"ತುಪ್ಪ, ಗೋಡಂಬಿಯೊಂದಿಗೆ ಸಿಹಿ ರವಾ ಕೇಸರಿ."}};
function desc(id){return (DESC[id]&&DESC[id][lang])||(DESC[id]&&DESC[id].en)||MENU[id].d||"a house favourite, freshly prepared.";}
let lang="en",outlet=null,cart={},notes={},upsold=false;
const HOUR=new Date().getHours();
const part=()=>HOUR<11?"morning":HOUR<16?"afternoon":"evening";
const TIME_FILTER=true;
const inWin=id=>MENU[id].h.some(w=>HOUR>=w[0]&&HOUR<w[1]);
const OPEN=Object.keys(MENU).some(inWin);
const avail=id=>!TIME_FILTER||!OPEN||inWin(id);
const chat=document.getElementById("chat");
function bot(html){const d=document.createElement("div");d.className="msg bot";d.innerHTML=html;chat.appendChild(d);scroll_();return d;}
function me(t){const d=document.createElement("div");d.className="msg me";d.textContent=t;chat.appendChild(d);scroll_();}
function block(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;chat.appendChild(d);scroll_();return d;}
function scroll_(){setTimeout(()=>chat.scrollTop=chat.scrollHeight,30);}

/* ---------- outlet picker ---------- */
function renderOutlets(){chat.innerHTML="";document.getElementById("bar").style.display="none";document.getElementById("wm").style.display="none";document.getElementById("back").style.display="none";document.getElementById("hname").textContent="Sree Annapoorna";document.getElementById("hsub").textContent=T("chooseSub");bot(T("welcome"));
 block("outlet",OUTLETS.map(o=>`<button onclick="chooseOutlet('${o}')">📍 ${o}</button>`).join(""));
 block("wmark",`<img src="${LOGO}"><div class="cap">${T("pureVeg")}</div>`);}
function chooseOutlet(o){document.getElementById("bar").style.display="";document.getElementById("wm").style.display="";document.getElementById("back").style.display="";document.getElementById("inp").placeholder=T("ask");outlet=o;document.getElementById("hname").textContent="Annapoorna · "+o;document.getElementById("hsub").textContent="AI Waiter — powered by Odysra";showGreeting();}
function goOutlets(){cart={};notes={};upsold=false;outlet=null;refreshCart();closeModal();renderOutlets();}

/* ---------- dishes ---------- */
function dishFooter(id){
 if(cart[id])return `<div class="qtys"><button onclick="dec2('${id}')">−</button><span>${cart[id]}</span><button onclick="inc2('${id}')">+</button></div><button class="infob" onclick="explainDish('${id}')" title="Tell me about this">ℹ️</button>`;
 return `<button class="add" onclick="addDish('${id}')">+ Add</button><button class="infob" onclick="explainDish('${id}')" title="Tell me about this">ℹ️</button>`;}
function dishCard(id){const m=MENU[id];
 return `<div class="dish" data-id="${id}"><div class="pic">${m.e}</div><div class="bd">${m.best?'<div class="tag">★ BESTSELLER</div>':''}<div class="nm">${dn(id)}</div><div class="pr">₹${m.p}</div><div class="frow">${dishFooter(id)}</div></div></div>`;}
function sync(){refreshCart();document.querySelectorAll('.dish[data-id]').forEach(el=>{const f=el.querySelector('.frow');if(f)f.innerHTML=dishFooter(el.dataset.id);});}
function addDish(id){cart[id]=(cart[id]||0)+1;sync();upsell();}
function inc2(id){cart[id]++;sync();}
function dec2(id){cart[id]--;if(cart[id]<=0){delete cart[id];delete notes[id];}sync();}
function explainDish(id){const m=MENU[id];bot(`💬 <b>${dn(id)}</b> — ${desc(id)} <span style="color:#2645A8;font-weight:700">₹${m.p}</span>`);block("grid",[dishCard(id)]);exploreBar();}
function grid(ids){ids=ids.filter(avail);if(!ids.length){bot("Those aren't being served right now — here's what's hot at this hour.");return showSpecials();}block("grid",ids.map(dishCard).join(""));exploreBar();}
function refreshCart(){let n=0,t=0;for(const k in cart){n+=cart[k];t+=cart[k]*MENU[k].p;}const b=document.getElementById("cartbar");if(n){b.style.display="block";b.textContent=`🛒 ${T("viewCart")} (${n}) · ₹${t}`;}else b.style.display="none";}

/* ---------- per-dish note ---------- */
function openNote(id){openSheet(`<h2>Note for ${dn(id)}</h2><div class="fld"><label>Any instructions for the kitchen?</label><textarea id="nt" rows="3" placeholder="e.g. less spicy, no coriander, extra crispy">${notes[id]||""}</textarea></div><button class="btn" onclick="saveNote('${id}')">Save note</button>`);}
function saveNote(id){const v=document.getElementById("nt").value.trim();if(v){notes[id]=v;if(!cart[id])cart[id]=1;}else{delete notes[id];}
 sync();closeModal();openCart();}

/* ---------- upsell ---------- */
function upsell(){if(upsold)return;const ids=Object.keys(cart);if(!ids.length||ids.some(i=>MENU[i].bev))return;
 let sug=[];ids.forEach(i=>(MENU[i].pairs||[]).forEach(p=>{if(MENU[p]&&MENU[p].bev&&avail(p)&&!cart[p]&&!sug.includes(p))sug.push(p);}));
 if(!sug.length)sug=["coffee","mango"].filter(avail);sug=sug.slice(0,2);if(!sug.length)return;upsold=true;
 const names=sug.map(s=>dn(s)).join(" & ");
 setTimeout(()=>{block("pair",`<p>🍹 Add a drink? Our <b>${names}</b> go beautifully with your order.</p><div class="row">${sug.map(s=>`<div class="pi"><div class="e">${MENU[s].e}</div><div class="n">${dn(s)}</div><button class="add" onclick="addDish('${s}')">+ ₹${MENU[s].p}</button></div>`).join("")}</div>`);exploreBar();},420);}

/* ---------- conversation ---------- */
function exploreBar(){block("chips",`<button class="chip go" onclick="explore()">${T("exploreMore")}</button><button class="chip alt" onclick="showSpecials()">${T("specials")}</button>${Object.keys(cart).length?`<button class="chip alt" onclick="openCart()">🛒 ${T("viewCart")}</button>`:''}`);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function typingBubble(){const d=document.createElement("div");d.className="msg bot typing";d.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>';chat.appendChild(d);scroll_();return d;}
function topDishes(){let b=Object.keys(MENU).filter(i=>MENU[i].best&&avail(i));
 if(b.length<4)b=b.concat(Object.keys(MENU).filter(i=>avail(i)&&!b.includes(i)));
 if(!b.length)b=Object.keys(MENU).filter(i=>MENU[i].best);
 return b.slice(0,4);}
async function showGreeting(instant){chat.innerHTML="";upsold=false;
 if(!instant){let t=typingBubble();await sleep(500);t.remove();}
 bot(GREET[lang].replace("%t",part()).replace("%o",outlet||""));
 if(!instant){await sleep(450);let t=typingBubble();await sleep(600);t.remove();}
 bot(FRESH[lang]);
 if(!instant)await sleep(300);
 const best=topDishes();const g=block("grid","");
 for(const id of best){g.insertAdjacentHTML("beforeend",dishCard(id));scroll_();if(!instant)await sleep(260);}
 if(!instant)await sleep(200);mainChips();}
function showSpecials(quiet){const best=topDishes();if(!quiet)me("Today's specials");
 bot(`Here's what's <b>hot &amp; fresh</b> this ${part()} 👇`);block("grid",best.map(dishCard).join(""));mainChips();}
function mainChips(){block("chips",`<button class="chip go" onclick="explore()">${T("exploreFull")}</button><button class="chip" onclick="showSpecials()">${T("specialsLong")}</button><button class="chip alt" onclick="info()">${T("info")}</button><button class="chip alt" onclick="banquet()">${T("banquet")}</button>`);}
function explore(){me(T("exploreMore"));const cs=CATS.filter(c=>(c.ids||(c.subs||[]).flatMap(s=>s.ids)).some(avail));
 bot(`${T("whatExplore")} <span style='color:#7b8190'>${T("timeNote")}</span>`);
 block("chips",cs.map((c)=>`<button class="chip" onclick="openCat(${CATS.indexOf(c)})">${c.name}</button>`).join("")+`<button class="chip alt" onclick="mainChips()">${T("home")}</button>`);}
function openCat(i){const c=CATS[i];me(c.name);if(c.subs){const ss=c.subs.filter(s=>s.ids.some(avail));bot(`<b>${c.name}</b> — ${T("pickType")}:`);
  block("chips",ss.map((s)=>`<button class="chip" onclick="openSub(${i},${c.subs.indexOf(s)})">${s.name}</button>`).join("")+`<button class="chip alt" onclick="explore()">${T("back")}</button>`);
 }else{bot(`<b>${c.name}</b> — ${T("tapAdd")}:`);grid(c.ids);}}
function openSub(i,j){const s=CATS[i].subs[j];me(s.name);bot(`<b>${s.name}</b> — ${T("tapAdd")}:`);grid(s.ids);}
function info(){me("Restaurant info");bot(`📍 <b>Annapoorna, ${outlet}</b><br>🕖 Open 6:30 AM – 11:00 PM, all days<br>🅿️ Valet parking available<br>❄️ AC &amp; Non-AC dining halls<br>📞 0422-xxxxxxx`);exploreBar();}
function banquet(){me("Banquet hall enquiry");bot(`We'd be glad to host your event at <b>${outlet}</b>! 🎉 Our hall seats up to 250 with pure-veg catering. Leave your details and our banquet manager will call you.`);
 openSheet(`<h2>Banquet enquiry</h2><div class="fld"><label>Name</label><input id="bn"></div><div class="fld"><label>Phone</label><input id="bp" inputmode="tel"></div><div class="fld"><label>Event date</label><input id="bd" placeholder="e.g. 15 Aug"></div><div class="fld"><label>Approx. guests</label><input id="bg" inputmode="numeric"></div><button class="btn" onclick="closeModal();bot('✅ Thanks! Our banquet manager will call you shortly. (Lead captured for staff.)')">Submit enquiry</button>`);}

/* ---------- voice ----------
   Primary: record audio and send to /api/stt (Sarvam) for accurate Indian-language transcription.
   Fallback: the browser's built-in SpeechRecognition (used if recording isn't supported or
   Sarvam isn't configured). */
function setMic(on){const m=document.getElementById("mic");m.classList.toggle("on",on);m.textContent=on?"⏺":"🎙️";}
function heard(t){const inp=document.getElementById("inp");inp.value=(inp.value?inp.value.trim()+" ":"")+t;}
function simHeard(){const s=["something light and not too spicy","what's good for breakfast","show me the dosa varieties","I'd like a sweet dish","recommend a good cold drink"];
 bot("🎙️ <i>(Voice needs Chrome with mic permission — simulating a query for this demo)</i>");setTimeout(()=>heard(s[Math.floor(Math.random()*s.length)]),500);}
const SLANG={en:'en-IN',ta:'ta-IN',hi:'hi-IN',ml:'ml-IN',te:'te-IN',kn:'kn-IN'};
let listening=false,mediaRec=null,chunks=[],micStream=null,sttBroken=false,recog=null;
function recordVoice(){
 if(listening){stopVoice();return;}
 // Use the browser engine if Sarvam has failed before, or audio recording isn't available.
 if(sttBroken||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){startBrowserSR();return;}
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  micStream=stream;chunks=[];
  try{mediaRec=new MediaRecorder(stream);}catch(e){mediaRec=new MediaRecorder(stream,{});}
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data);};
  mediaRec.onstop=()=>{if(micStream)micStream.getTracks().forEach(t=>t.stop());transcribe(new Blob(chunks,{type:(mediaRec&&mediaRec.mimeType)||'audio/webm'}));};
  listening=true;setMic(true);mediaRec.start();
 }).catch(()=>{listening=false;setMic(false);bot("🎙️ Please allow microphone access to use voice.");});
}
function stopVoice(){
 if(mediaRec&&mediaRec.state&&mediaRec.state!=="inactive"){listening=false;setMic(false);try{mediaRec.stop();}catch(e){}return;}
 listening=false;setMic(false);if(recog){try{recog.stop();}catch(e){}}
}
async function transcribe(blob){
 const inp=document.getElementById("inp");const typing=typingBubble();
 try{
  const fd=new FormData();fd.append('file',blob,'audio.webm');fd.append('lang',lang);
  const res=await fetch('/api/stt',{method:'POST',body:fd});
  if(!res.ok)throw 0;const data=await res.json();typing.remove();
  const t=(data.text||"").trim();
  if(t){inp.value=(inp.value?inp.value.trim()+" ":"")+t;inp.focus();}
  else bot("🎙️ I couldn't catch that — please try once more.");
 }catch(e){
  typing.remove();sttBroken=true;
  bot("🎙️ High-accuracy voice isn't switched on yet — using the basic engine. Tap the mic and speak again.");
 }
}
function startBrowserSR(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){simHeard();return;}
 recog=new SR();recog.lang=SLANG[lang]||'en-IN';recog.continuous=true;recog.interimResults=true;
 const inp=document.getElementById("inp");let finalText=inp.value?inp.value.trim()+" ":"";
 recog.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+" ";else interim+=t;}inp.value=(finalText+interim).trim();};
 recog.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){listening=false;setMic(false);bot("🎙️ Please allow microphone access to use voice.");}else if(listening){try{recog.start();}catch(e){}}};
 recog.onend=()=>{if(listening){try{recog.start();}catch(e){}}else setMic(false);};
 listening=true;setMic(true);try{recog.start();}catch(e){}
}

/* ---------- free text "AI" ---------- */
async function sendText(){const inp=document.getElementById("inp");const v=inp.value.trim();if(!v)return;if(listening)stopVoice();inp.value="";me(v);await askOdy(v);}
async function askOdy(q){const typing=typingBubble();
 try{const res=await fetch('/api/ody',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,lang,cart:Object.keys(cart)})});
  if(!res.ok)throw 0;const data=await res.json();typing.remove();
  if(data.reply)bot(data.reply);const added=runActions(data.actions);
  if(added)confirmOrder();else exploreBar();
 }catch(e){typing.remove();ai(q.toLowerCase());}}
function runActions(acts){let added=0;(acts||[]).forEach(a=>{
  if(a.type==="add"&&MENU[a.id]){const q=Math.max(1,a.qty||1);for(let i=0;i<q;i++)addDish(a.id);added+=q;}
  else if(a.type==="show"&&a.ids){const ids=a.ids.filter(i=>MENU[i]&&avail(i));if(ids.length)block("grid",ids.map(dishCard).join(""));}
  else if(a.type==="category"&&a.name){const i=CATS.findIndex(c=>c.name.toLowerCase()===String(a.name).toLowerCase());if(i>=0)openCat(i);}
});return added>0;}
function confirmOrder(){bot(T("confirmQ"));block("chips",`<button class="chip go" onclick="openCart()">${T("yes")}</button><button class="chip alt" onclick="orderNo()">${T("no")}</button>`);}
function orderNo(){bot(T("noMore"));mainChips();}
function ai(q){const sug=(id,txt)=>{bot(txt);block("grid",[dishCard(id)]);exploreBar();};
 if(/banquet|hall|function|wedding|event/.test(q))return banquet();
 if(/time|open|close|parking|address|location|where/.test(q))return info();
 if(/jain|onion|garlic/.test(q)){bot("We're a fully <b>pure-vegetarian</b> restaurant 🟢. We don't do special Jain (no onion-garlic) preparations, but you can add a 📝 note on any dish and the kitchen will keep it simple where possible.");return exploreBar();}
 if(/spicy|spice|hot/.test(q))return avail("chilliparotta")?sug("chilliparotta","If you want a kick 🌶️, our Chilli Parotta is a favourite right now:"):bot("For a bit of spice, our chaat and chutneys hit the spot. Tap Explore more for the chaat menu!");
 if(/light|not heavy|simple/.test(q))return avail("idli")?sug("idli","Something light? Our soft Idli is gentle and comforting:"):sug("curdrice","Something light? Curd Rice is light and soothing:");
 if(/sweet|dessert|jamun/.test(q)){const sw=["hotjamun","rasagulla","gulab"].find(i=>MENU[i]);return sug(sw,"For something sweet 🍮, here's a classic finish:");}
 if(/coffee|drink|beverage|thirsty|cold/.test(q))return sug(avail("mango")?"mango":"coffee","Here's a refreshing pick for you:");
 if(/breakfast|morning|tiffin/.test(q))return openCat(0);
 if(/recommend|best|special|good|popular|suggest/.test(q))return showSpecials();
 bot("I can help you explore Annapoorna's menu, recommend dishes, answer about ingredients or take your order. Tap <b>Explore more</b> or tell me what you feel like! 🙂");exploreBar();}

/* ---------- cart & checkout ---------- */
const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");
function openSheet(html){sheet.innerHTML=html;modal.style.display="flex";sheet.scrollTop=0;}
function closeModal(){modal.style.display="none";}
function cartTotal(){let t=0;for(const k in cart)t+=cart[k]*MENU[k].p;return t;}
function recos(){const inCart=Object.keys(cart);let r=[];
 inCart.forEach(id=>(MENU[id].pairs||[]).forEach(p=>{if(MENU[p]&&avail(p)&&!cart[p]&&!r.includes(p))r.push(p);}));
 if(!inCart.some(i=>MENU[i].bev)){const b=Object.keys(MENU).filter(i=>MENU[i].bev&&avail(i)&&!cart[i]&&!r.includes(i));if(b[0])r.push(b[0]);}
 const dz=["hotjamun","rasagulla","rasamalai","gulab","kesari"];if(!inCart.some(i=>dz.includes(i))){const dd=dz.filter(i=>MENU[i]&&avail(i)&&!cart[i]&&!r.includes(i));if(dd[0])r.push(dd[0]);}
 if(r.length<3)Object.keys(MENU).filter(i=>MENU[i].best&&avail(i)&&!cart[i]&&!r.includes(i)).forEach(i=>{if(r.length<3)r.push(i);});
 return r.slice(0,3);}
function recoHTML(){const r=recos();if(!r.length)return"";
 return `<div class="recohd">✨ ${T("alsoLike")}</div>`+r.map(id=>`<div class="rc"><div class="e">${MENU[id].e}</div><div class="rg"><div class="rn">${dn(id)}</div><div class="rp">₹${MENU[id].p}</div></div><button class="radd" onclick="addReco('${id}')">+ ${T("add")}</button></div>`).join("");}
function addReco(id){cart[id]=(cart[id]||0)+1;sync();openCart();}
function openCart(){const ks=Object.keys(cart);if(!ks.length)return;
 openSheet(`<h2>Your cart</h2><div class="note" style="margin:0 0 8px">Bill shown in English for clarity 🧾</div>${ks.map(k=>`<div class="ci"><div class="e">${MENU[k].e}</div><div class="g"><div class="n">${MENU[k].n}</div><div class="p">₹${MENU[k].p}</div>${notes[k]?`<div class="cnote">📝 ${notes[k]}</div>`:''}<button class="noteb ${notes[k]?'has':''}" style="margin-top:5px;font-size:11px" onclick="openNote('${k}')">📝 ${notes[k]?'Edit note':'Add note'}</button></div><div class="qty"><button onclick="dec('${k}')">−</button><span>${cart[k]}</span><button onclick="inc('${k}')">+</button></div></div>`).join("")}<div class="tot big"><span>Subtotal</span><span>₹${cartTotal()}</span></div>${recoHTML()}<button class="btn" style="background:#fff;color:#2645A8;border:1.5px solid #2645A8" onclick="closeModal()">🍽️ Explore more</button><button class="btn g" onclick="checkout()">Checkout →</button>`);}
function inc(k){cart[k]++;sync();openCart();}
function dec(k){cart[k]--;if(cart[k]<=0){delete cart[k];delete notes[k];}sync();Object.keys(cart).length?openCart():closeModal();}
let order={mode:null,table:null,room:null};
function checkout(){order={mode:null,table:null,room:null};openSheet(`<h2>How are you dining?</h2><div class="opt"><button id="din" onclick="setMode('dine')">🍽️ Dine-in</button><button id="tak" onclick="setMode('take')">🥡 Takeaway</button></div><div id="ckbody"></div>`);}
function setMode(m){order.mode=m;document.getElementById("din").classList.toggle("on",m==="dine");document.getElementById("tak").classList.toggle("on",m==="take");
 const b=document.getElementById("ckbody");
 if(m==="dine")b.innerHTML=`<div class="fld"><label>Table number (1–24)</label><input id="tbl" inputmode="numeric" oninput="roomFromTable()"></div><div id="roomline"></div><div id="contbtn"></div>`;
 else{b.innerHTML=`<div class="note">🥡 Takeaway — packed fresh for pickup.</div><div id="contbtn"></div>`;document.getElementById("contbtn").innerHTML=`<button class="btn" onclick="contact()">Continue →</button>`;}}
function roomFromTable(){const v=parseInt(document.getElementById("tbl").value);const rl=document.getElementById("roomline"),cb=document.getElementById("contbtn");
 if(!v||v<1||v>24){rl.innerHTML="";cb.innerHTML="";return;}order.table=v;order.room=v<=12?"Non-AC":"AC";
 rl.innerHTML=`<div class="note">Table ${v} → <b>${order.room} hall</b> ${order.room==="AC"?"❄️":""}</div>`;cb.innerHTML=`<button class="btn" onclick="contact()">Continue →</button>`;}
function taxRate(){return order.mode==="dine"&&order.room==="AC"?0.075:0.05;}
function contact(){const sub=cartTotal(),tax=Math.round(sub*taxRate()),gt=sub+tax;
 openSheet(`<h2>Confirm &amp; pay</h2><div class="tot"><span>Outlet</span><span>${outlet}</span></div><div class="tot"><span>Order type</span><span>${order.mode==="dine"?`Dine-in · ${order.room} · T${order.table}`:"Takeaway"}</span></div><div class="tot"><span>Subtotal</span><span>₹${sub}</span></div><div class="tot"><span>GST &amp; charges (${(taxRate()*100)}%)</span><span>₹${tax}</span></div><div class="tot big"><span>Grand total</span><span>₹${gt}</span></div><div class="fld" style="margin-top:14px"><label>Your name</label><input id="cn"></div><div class="fld"><label>Number of persons</label><input id="cpers" inputmode="numeric" placeholder="e.g. 4 (helps us serve you better)"></div><div class="fld"><label>WhatsApp number</label><input id="cp" inputmode="tel" placeholder="+91"></div><div class="note">Bill is sent to WhatsApp <b>only after full payment</b>.</div><button class="btn g" onclick="pay(${gt})">Pay ₹${gt} →</button>`);}
function pay(gt){const nm=(document.getElementById("cn").value||"Guest"),ph=(document.getElementById("cp").value||"your number"),pers=(document.getElementById("cpers")&&document.getElementById("cpers").value)||"";
 openSheet(`<div class="ok"><div class="big">⏳</div><h2>Sending to Annapoorna's system…</h2><p>Processing payment securely in their app</p></div>`);
 setTimeout(()=>{openSheet(`<div class="ok"><div class="big">✅</div><h2>Payment successful!</h2><p>Thanks ${nm}! Your order is confirmed and sent to the ${outlet} kitchen.</p><p>🧾 Bill sent on WhatsApp to <b>${ph}</b>.</p><p style="margin-top:10px;font-size:12px">${order.mode==="dine"?`Table ${order.table} · ${order.room}`:"Takeaway"}${pers?` · ${pers} persons`:""} · Paid ₹${gt}</p><button class="btn" onclick="reset_()">Done</button></div>`);cart={};notes={};sync();},1400);}
function reset_(){closeModal();upsold=false;showGreeting();}

/* init */
document.getElementById("langbar").innerHTML=LANGS.map(l=>`<button class="lang ${l[0]==='en'?'on':''}" onclick="setLang('${l[0]}',this)">${l[1]}</button>`).join("");
function setLang(l,b){lang=l;document.querySelectorAll(".lang").forEach(x=>x.classList.remove("on"));b.classList.add("on");
 document.getElementById("inp").placeholder=T("ask");outlet?showGreeting(true):renderOutlets();}
document.getElementById("wm").innerHTML='<img src="'+LOGO+'">';
renderOutlets();
</script>
