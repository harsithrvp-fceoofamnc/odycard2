<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D'VOUR — Menu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
.app{max-width:440px;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:#fff;
  box-shadow:0 0 60px rgba(0,0,0,.7);display:flex;flex-direction:column}

/* ---------------- shutter ---------------- */
#shut{position:absolute;inset:0;z-index:90;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(180deg,#121212 0 13px,#1c1c1c 13px 14px,#0b0b0b 14px 15px),
    #131313;
  transition:transform 1.5s cubic-bezier(.72,.02,.28,1)}
#shut.up{transform:translateY(-101%)}
#shut img{width:62%;max-width:250px;opacity:.96}
#shut .bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#ffc400}
#shut .rail{position:absolute;left:0;right:0;bottom:12px;height:5px;background:#000}
.tap{position:absolute;left:0;right:0;bottom:58px;text-align:center;font-size:10.5px;font-weight:800;
  letter-spacing:.26em;color:#ffc400;animation:pulse 2.1s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ---------------- board ---------------- */
.board{flex:0 0 auto;background:#0e0e0e;padding:26px 20px 24px;display:flex;align-items:center;
  justify-content:center;position:relative;
  background-image:repeating-linear-gradient(70deg,rgba(255,255,255,.022) 0 2px,transparent 2px 26px)}
.board img{width:60%;max-width:240px;display:block}
.rule{flex:0 0 auto;height:3px;background:#ffc400}
.globe{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---------------- body ---------------- */
.body{flex:1;overflow-y:auto;padding:15px 14px 6px;scrollbar-width:none;background:#fff}
.body::-webkit-scrollbar{display:none}
.msg{background:#fff;border:1px solid #eceef1;border-radius:17px;border-top-left-radius:6px;
  padding:13px 15px;font-size:14.5px;line-height:1.55;color:#16161a;max-width:90%;margin-bottom:11px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.you{background:#111;color:#fff;border-radius:17px;border-top-right-radius:6px;padding:11px 15px;
  font-size:13.5px;margin:0 0 11px auto;width:fit-content;max-width:80%;
  animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:5px;padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:#c9ccd2;animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:#fff;border:1px solid #ececef;border-radius:16px;padding:13px 13px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.04);
  animation:up .48s cubic-bezier(.2,.8,.2,1) both}
.card.off{opacity:.48}
.nm{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;font-weight:700;color:#16161a;line-height:1.32}
.veg,.non{width:13px;height:13px;flex:0 0 auto;margin-top:2px;border:1.6px solid #0e7a3c;border-radius:2px;position:relative}
.non{border-color:#c0392b}
.veg:after,.non:after{content:"";position:absolute;inset:2.6px;border-radius:50%;background:#0e7a3c}
.non:after{background:#c0392b}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#c99400;margin-top:6px}
.ds{font-size:11.5px;color:#8b8d93;line-height:1.5;margin-top:6px;min-height:34px}
.pr{font-size:16px;font-weight:800;color:#16161a;margin-top:9px}
.soldout{font-size:10.5px;font-weight:800;color:#9a9ca1;margin-top:9px;letter-spacing:.03em}

/* ---------------- categories ---------------- */
.bar{flex:0 0 auto;background:#fff;border-top:1px solid #eceef1;padding:11px 12px calc(13px + env(safe-area-inset-bottom))}
.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:1.5px solid #17171a;background:#fff;border-radius:11px;padding:9px 15px;
  font-size:13px;font-weight:700;color:#17171a;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
.cat:active{transform:scale(.95)}
.cat.on{background:#ffc400;border-color:#ffc400;color:#17171a}
</style>
</head>
<body>
<div class="app">

  <div id="shut" onclick="open_()">
    <img src="assets/logo.png" alt="D'VOUR">
    <div class="tap">TAP TO ENTER</div>
    <div class="rail"></div><div class="bar"></div>
  </div>

  <div class="board">
    <img src="assets/logo.png" alt="D'VOUR">
    <div class="globe">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
    </div>
  </div>
  <div class="rule"></div>

  <div class="body" id="body"></div>

  <div class="bar"><div class="cats" id="cats"></div></div>
</div>

<script>
const MENU={
 favourites:{label:"⭐ Favourites",items:["korean","nash","cheesef","wings"]},
 burgers:{label:"🍔 Burgers",items:["classicv","korean","nash","tandoori","peri","dunk","powerhouse","bigfoot"]},
 fries:{label:"🍟 Fries",items:["classicf","perif","cheesef","koreanloaded","paneerloaded"]},
 wings:{label:"🍗 Starters",items:["tender","nashtender","wings","wingstower"]},
 mexican:{label:"🌮 Mexican",items:["mexrv","mexrc","mexsv","mexsc"]},
 drinks:{label:"🥤 Drinks",items:["bubble","lemon","blue","lavender","butterb"]}
};
const D={
 classicv:{n:"Classic Burger",p:150,v:1,t:"",d:"Grill patty, layered fresh veggies, cheese melt, bun hug."},
 korean:{n:"Korean Burger",p:230,v:1,t:"BESTSELLER",d:"Korean-spiced patty, kimchi crunch, gochujang mayo, soft bun."},
 nash:{n:"Nashville Chicken Burger",p:250,v:0,t:"MUST TRY",d:"Crispy fried chicken, Nashville spice kick, tangy pickles, soft bun."},
 tandoori:{n:"Tandoori Burger",p:230,v:1,t:"",d:"Smoky tandoori patty, mint mayo, onion crunch — desi delight."},
 peri:{n:"Peri Peri Burger",p:230,v:1,t:"",d:"Fiery peri peri patty, cheesy melt, spicy mayo — kick in every bite."},
 dunk:{n:"Cheese Dunk Burger",p:270,v:1,t:"CHEF'S PICK",d:"Loaded with cheese inside and out, built to dunk."},
 powerhouse:{n:"Powerhouse Burger",p:230,v:1,t:"",d:"Protein packed patty, cheesy punch, loaded greens."},
 bigfoot:{n:"Big Foot Burger",p:550,v:0,t:"THE BIG ONE",d:"Two flame-grilled patties stacked with cheddar, caramelised onions, crispy bacon."},
 classicf:{n:"Classic Fries",p:110,v:1,t:"",d:"Crispy fries tossed in tangy tandoori seasoning, served hot."},
 perif:{n:"French Fries Peri Peri",p:130,v:1,t:"",d:"Coated in bold, zesty peri peri seasoning."},
 cheesef:{n:"Cheesy French Fries",p:150,v:1,t:"BESTSELLER",d:"Smothered in rich melted cheese sauce, served hot."},
 koreanloaded:{n:"Korean Loaded Fries",p:250,v:0,t:"MUST TRY",d:"Crispy fries topped with Korean chicken, cheese sauce and spicy mayo."},
 paneerloaded:{n:"Paneer Loaded Fries",p:250,v:1,t:"",d:"Topped with spicy paneer, cheese and sauces — with a mint mojito."},
 tender:{n:"Fried Chicken Tender",p:200,v:0,t:"",d:"Juicy golden-fried strips with your choice of dipping sauce."},
 nashtender:{n:"Nashvilli Chicken Tenders",p:220,v:0,t:"",d:"Tossed in fiery Nashville hot sauce, with pickles and cooling ranch."},
 wings:{n:"Buffalo Wings",p:220,v:0,t:"MUST TRY",d:"Tossed in tangy buffalo sauce, with ranch or blue cheese dip."},
 wingstower:{n:"Buffalo Wings Tower",p:270,v:0,t:"",d:"Crispy wings in tangy buffalo sauce with dip and a mojito.",off:1},
 mexrv:{n:"Mexican Rice (Veg)",p:180,v:1,t:"",d:"Fragrant rice with golden seared paneer, sweet corn and bell peppers."},
 mexrc:{n:"Mexican Rice (Chicken)",p:200,v:0,t:"",d:"Smoky seasoned chicken over mildly spiced Mexican rice."},
 mexsv:{n:"Mexican Spaghetti (Veg)",p:180,v:1,t:"",d:"Creamy, mildly spiced spaghetti with soft paneer bites."},
 mexsc:{n:"Mexican Spaghetti (Chicken)",p:200,v:0,t:"",d:"Tender chicken folded into rich, buttery spaghetti."},
 bubble:{n:"Bubble Gum Mojito",p:80,v:1,t:"",d:"Sweet, fizzy and cold."},
 lemon:{n:"Lemon Mint Mojito",p:80,v:1,t:"",d:"Sharp, fresh and cooling."},
 blue:{n:"Blue Curacao",p:80,v:1,t:"",d:"Citrusy and refreshing."},
 lavender:{n:"Lavender Lemonade",p:100,v:1,t:"",d:"Floral, tart and light."},
 butterb:{n:"Harry Potter Butter B Fizz",p:150,v:1,t:"FAN FAVOURITE",d:"Butterscotch cream soda — 500ml of nostalgia."}
};

const $=i=>document.getElementById(i);
let busy=false;
function open_(){
  $("shut").classList.add("up");
  setTimeout(()=>$("shut").style.display="none",1600);
}
function cardHtml(id,d){
  const m=D[id];
  return `<div class="card ${m.off?'off':''}" style="animation-delay:${d}s">
    <div class="nm"><span class="${m.v?'veg':'non'}"></span>${m.n}</div>
    ${m.t?`<div class="tag">★ ${m.t}</div>`:""}
    <div class="ds">${m.d}</div>
    ${m.off?`<div class="soldout">SOLD OUT TODAY</div>`:`<div class="pr">₹${m.p}</div>`}
  </div>`;
}
function show(key,userSaid){
  if(busy)return; busy=true;
  const c=MENU[key], box=$("body");
  [...document.querySelectorAll(".cat")].forEach(b=>b.classList.toggle("on",b.dataset.k===key));
  if(userSaid) box.insertAdjacentHTML("beforeend",`<div class="you">${c.label}</div>`);
  box.insertAdjacentHTML("beforeend",`<div class="msg" id="tp"><div class="dots"><i></i><i></i><i></i></div></div>`);
  box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    $("tp").remove();
    const line = key==="favourites"
      ? "Here are some of our favourites 🍟👇"
      : `Here's everything in <b>${c.label.replace(/^\S+\s/,"")}</b> 👇`;
    box.insertAdjacentHTML("beforeend",`<div class="msg">${line}</div>
      <div class="grid">${c.items.map((id,i)=>cardHtml(id,i*.06)).join("")}</div>`);
    box.scrollTop=box.scrollHeight;
    busy=false;
  },520);
}
$("cats").innerHTML=Object.keys(MENU).map(k=>
  `<button class="cat" data-k="${k}" onclick="show('${k}',1)">${MENU[k].label}</button>`).join("");
$("body").innerHTML=`<div class="msg">Hi! 🍔 Welcome to <b>D'VOUR</b> — what are you craving today?</div>`;
setTimeout(()=>show("favourites",0),300);
</script>
</body>
</html>
