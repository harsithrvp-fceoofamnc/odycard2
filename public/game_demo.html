<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bon Bon — Scoop Stacker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e9cf94;--cream:#f5e9e6;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%}
  body{background:#000;font-family:"Jost",sans-serif;color:var(--cream)}
  .app{max-width:460px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;
    background:radial-gradient(95% 55% at 50% 110%, rgba(0,0,0,.5), transparent 60%),
      radial-gradient(120% 85% at 50% -8%, #8a2036 0%, #5a1224 40%, #360a15 78%, #22060c 100%)}
  .app::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(58% 28% at 50% 5%, rgba(233,207,148,.18), transparent 70%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .serif{font-family:"Cormorant Garamond",serif}
  #hud{position:absolute;top:18px;left:0;right:0;text-align:center;z-index:3;pointer-events:none}
  #hud .sc{font-family:"Cormorant Garamond",serif;font-size:58px;font-weight:700;color:#fff;line-height:1;text-shadow:0 3px 16px rgba(0,0,0,.55)}
  #hud .lb{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:.9}
  #combo{position:absolute;top:88px;left:0;right:0;text-align:center;z-index:3;pointer-events:none;color:var(--gold);font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700;opacity:0}
  #combo.show{animation:cp .8s ease}
  @keyframes cp{0%{opacity:0;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
  .ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
  #start{background:rgba(30,6,12,.35)}
  #over{top:auto;left:0;right:0;bottom:0;height:auto;justify-content:flex-end;padding:70px 24px 34px;
    background:linear-gradient(transparent,rgba(20,5,10,.55) 26%,rgba(20,5,10,.94));display:none;animation:fd .35s ease}
  #over.on{display:flex}
  @keyframes fd{from{opacity:0}to{opacity:1}}
  .k{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  .ti{font-family:"Cormorant Garamond",serif;font-size:46px;font-weight:700;color:#fff;line-height:1}
  .big{font-family:"Cormorant Garamond",serif;font-size:30px;color:#fff}
  .n{font-family:"Cormorant Garamond",serif;font-size:80px;font-weight:700;color:var(--gold);line-height:1;margin:4px 0 0}
  .msg{color:#e6c1bb;font-size:13px;margin:6px 0 24px}
  .pill{padding:14px 30px;border-radius:30px;border:0;background:var(--gold);color:#4a0e1a;font-weight:700;font-size:15.5px;cursor:pointer;margin:5px}
  .pill.g{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .hint{margin-top:16px;color:#e6c1bb;font-size:13px;opacity:.85}
</style></head>
<body>
<div class="app">
  <canvas id="cv"></canvas>
  <div id="hud"><div class="sc" id="score">0</div><div class="lb">Scoops</div></div>
  <div id="combo"></div>

  <div class="ov" id="start">
    <div class="k">Bon Bon</div>
    <div class="ti serif">Scoop Stacker</div>
    <div class="hint">Tap to drop a scoop.<br>Line it up — stack them sky-high 🍦</div>
    <button class="pill" style="margin-top:26px" onclick="startGame()">Start</button>
  </div>

  <div class="ov" id="over">
    <div class="big serif">Your tower!</div>
    <div class="n" id="finalScore">0</div>
    <div class="msg" id="overMsg">scoops stacked</div>
    <div><button class="pill" onclick="shareImage()">Share 📸</button><button class="pill g" onclick="startGame()">Play again</button></div>
  </div>
</div>
<script>
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),dpr=Math.min(window.devicePixelRatio||1,2);
var W=0,H=0,rimY0=0,baseTipY0=0;
var CONE_W=94,CONE_H=118,STEP=34,RX=44,RY=33,TOL=40,PERFECT=13;
function resize(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);baseTipY0=H-14;rimY0=baseTipY0-CONE_H+18;}
window.addEventListener("resize",resize);

var FLAV=[
 {l:"#ffd0dc",d:"#ff6d93",s:"#ff9ab5"}, {l:"#c79463",d:"#5f3a1c",s:"#8a5a30"},
 {l:"#ffe6a4",d:"#ffab3d",s:"#ffce6a"}, {l:"#c9f4de",d:"#57cb9a",s:"#93e6c4"},
 {l:"#fff5d6",d:"#ffd97e",s:"#ffe9ad"}, {l:"#d3c6ff",d:"#8f7cf0",s:"#b4a4f5"},
 {l:"#e2f2bd",d:"#9ac954",s:"#c2e08c"}, {l:"#ffcef0",d:"#ff8bd6",s:"#ffb0e5"}
];
var SPR=["#ff5e8a","#ffd15c","#57cb9a","#8f7cf0","#ff8bd6","#fff"];
function newScoop(i){return {fl:FLAV[(Math.random()*FLAV.length)|0],swirl:Math.random()<.55,sprinkles:Math.random()<.4,tilt:(Math.random()-.5)*.14,sd:Array.from({length:6},()=>({a:Math.random()*6.28,r:Math.random(),c:SPR[(Math.random()*SPR.length)|0]}))};}

var scoops,active,score,camY,camT,running,toppling,parts,bodies,t0,startT,combo,swayPhase,raf;
function startGame(){
  resize();
  document.getElementById("start").style.display="none";document.getElementById("over").classList.remove("on");
  scoops=[]; score=0; camY=0; camT=0; running=true; toppling=false; parts=[]; bodies=[]; combo=0; swayPhase=0;
  active={x:W/2,dir:1,speed:2.4,s:newScoop(0)};
  document.getElementById("score").textContent="0";
  t0=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
}
function topX(){return scoops.length?scoops[scoops.length-1].x:W/2;}

function drop(){
  if(!running||toppling)return;
  var dx=active.x-topX();
  if(Math.abs(dx)>TOL){return fail();}
  var sc={x:active.x,s:active.s,settle:1};
  scoops.push(sc); score++; document.getElementById("score").textContent=score;
  if(Math.abs(dx)<PERFECT){combo++;burst(active.x, landingY(scoops.length-1));showCombo();}else combo=0;
  active={x:active.x<W/2?W-RX-8:RX+8,dir:active.x<W/2?-1:1,speed:Math.min(2.4+Math.floor(score/3)*0.4,8),s:newScoop(score)};
  var topScreen=rimY0-(scoops.length-1)*STEP;
  camT=Math.max(0,(118+STEP)-topScreen);
}
function showCombo(){if(combo<2)return;var c=document.getElementById("combo");c.textContent="Perfect  ×"+combo;c.classList.remove("show");void c.offsetWidth;c.classList.add("show");}
function landingY(i){return rimY0-i*STEP+camY;}

function fail(){
  // no collapse — freeze the tower standing so the player can snap & share it
  running=false; endGame(); raf=requestAnimationFrame(frame);
}

function burst(x,y){for(var i=0;i<16;i++){var a=Math.random()*6.28,sp=2+Math.random()*4;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,c:SPR[(Math.random()*SPR.length)|0]});}}

function frame(now){
  var dt=Math.min((now-t0)/16.67,2.5);t0=now;
  ctx.clearRect(0,0,W,H);
  camY+=(camT-camY)*0.14;
  swayPhase+=0.02;
  if(!toppling&&running){
    active.x+=active.speed*active.dir;
    if(active.x>W-RX-8){active.x=W-RX-8;active.dir=-1;} if(active.x<RX+8){active.x=RX+8;active.dir=1;}
  }
  // sway lean (cosmetic)
  var lean=Math.sin(swayPhase)*Math.min(scoops.length*1.1,20);

  if(toppling){
    ctx.save();
    for(var i=0;i<bodies.length;i++){var b=bodies[i];b.vy+=0.4;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;
      if(b.y>H-12){b.y=H-12;b.vy*=-0.42;b.vx*=0.8;b.vr*=0.8;}
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);drawScoop(0,0,b.s,false);ctx.restore();}
    ctx.restore();
    if(now-startT>1500){toppling=false;endGame();}
    drawParts(dt); raf=requestAnimationFrame(frame); return;
  }

  drawCone(W/2, baseTipY0+camY);
  // placed scoops
  for(var i=0;i<scoops.length;i++){var sc=scoops[i];var lx=sc.x+lean*(i/(scoops.length||1));var y=landingY(i);
    var sq=sc.settle>0?sc.settle:0; if(sc.settle>0)sc.settle=Math.max(0,sc.settle-0.09*dt);
    ctx.save();ctx.translate(lx,y);ctx.scale(1+0.14*sq,1-0.18*sq);drawScoop(0,0,sc.s,i===scoops.length-1);ctx.restore();}
  // active scoop (hide once the round is over so the frozen tower is clean)
  if(running) drawScoop(active.x,118,active.s,false);
  drawParts(dt);
  if(running) raf=requestAnimationFrame(frame);
}

function drawParts(dt){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=0.22*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=0.03*dt;if(p.life<=0){parts.splice(i,1);continue;}ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,6.28);ctx.fill();}ctx.globalAlpha=1;}

function drawScoop(x,y,s,cherry){
  ctx.save();ctx.translate(x,y);ctx.rotate(s.tilt);
  ctx.beginPath();ctx.ellipse(0,0,RX,RY,0,0,6.28);
  var g=ctx.createRadialGradient(-13,-13,4,0,4,RX+6);g.addColorStop(0,s.fl.l);g.addColorStop(1,s.fl.d);
  ctx.fillStyle=g;ctx.shadowColor="rgba(0,0,0,.28)";ctx.shadowBlur=8;ctx.shadowOffsetY=5;ctx.fill();ctx.shadowColor="transparent";
  ctx.save();ctx.clip();
  if(s.swirl){ctx.globalAlpha=.5;ctx.fillStyle=s.fl.s;ctx.beginPath();ctx.ellipse(11,4,RX*0.66,RY*0.72,-0.5,0,6.28);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.ellipse(-14,-14,RX*0.36,RY*0.3,-0.5,0,6.28);ctx.fill();
  if(s.sprinkles){for(var i=0;i<s.sd.length;i++){var d=s.sd[i];var px=Math.cos(d.a)*d.r*RX*0.7,py=Math.sin(d.a)*d.r*RY*0.7;ctx.save();ctx.translate(px,py-3);ctx.rotate(d.a);ctx.fillStyle=d.c;ctx.fillRect(-1.4,-4,2.8,8);ctx.restore();}}
  ctx.restore();
  if(cherry){ctx.strokeStyle="#7a4a24";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-RY);ctx.quadraticCurveTo(6,-RY-14,2,-RY-18);ctx.stroke();
    ctx.fillStyle="#d0263b";ctx.beginPath();ctx.arc(0,-RY-2,7.5,0,6.28);ctx.fill();ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.arc(-2.5,-RY-4.5,2.3,0,6.28);ctx.fill();}
  ctx.restore();
}

function drawCone(cx,tipY){
  var topY=tipY-CONE_H;
  ctx.save();
  ctx.beginPath();ctx.moveTo(cx-CONE_W/2,topY+10);ctx.lineTo(cx+CONE_W/2,topY+10);ctx.lineTo(cx,tipY);ctx.closePath();
  var g=ctx.createLinearGradient(0,topY,0,tipY);g.addColorStop(0,"#eec085");g.addColorStop(1,"#b07c3a");
  ctx.fillStyle=g;ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=8;ctx.shadowOffsetY=6;ctx.fill();ctx.shadowColor="transparent";
  ctx.clip();ctx.strokeStyle="rgba(105,58,14,.42)";ctx.lineWidth=2;
  for(var i=-CONE_W;i<CONE_W*2;i+=14){ctx.beginPath();ctx.moveTo(cx-CONE_W+i,topY);ctx.lineTo(cx-CONE_W+i+CONE_H,tipY);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+CONE_W-i,topY);ctx.lineTo(cx+CONE_W-i-CONE_H,tipY);ctx.stroke();}
  ctx.restore();
  ctx.beginPath();ctx.ellipse(cx,topY+10,CONE_W/2,11,0,0,6.28);var rg=ctx.createLinearGradient(0,topY,0,topY+20);rg.addColorStop(0,"#f3c98f");rg.addColorStop(1,"#d29a56");ctx.fillStyle=rg;ctx.shadowColor="rgba(0,0,0,.2)";ctx.shadowBlur=4;ctx.fill();ctx.shadowColor="transparent";
}

function endGame(){document.getElementById("finalScore").textContent=score;document.getElementById("overMsg").textContent=score>=14?"legendary tower! 🏆":score>=7?"nicely stacked!":"scoops stacked";document.getElementById("over").classList.add("on");}

function shareImage(){
  var sw=540, sh=740, c2=document.createElement("canvas"); c2.width=sw; c2.height=sh;
  var g=c2.getContext("2d"), keep=ctx;
  var bg=g.createLinearGradient(0,0,0,sh); bg.addColorStop(0,"#7c1730"); bg.addColorStop(.55,"#4a0f1f"); bg.addColorStop(1,"#280810");
  g.fillStyle=bg; g.fillRect(0,0,sw,sh);
  var rg=g.createRadialGradient(sw/2,72,10,sw/2,72,sw*0.72); rg.addColorStop(0,"rgba(233,207,148,.2)"); rg.addColorStop(1,"transparent"); g.fillStyle=rg; g.fillRect(0,0,sw,sh);
  g.textAlign="center";
  g.fillStyle="#e9cf94"; g.font="600 15px Jost, sans-serif"; g.fillText("B O N   B O N", sw/2, 52);
  g.fillStyle="#fff"; g.font="700 40px 'Cormorant Garamond', serif"; g.fillText("Scoop Stacker", sw/2, 96);
  // redraw the tower (swap the shared ctx used by the draw helpers)
  ctx=g;
  var n=scoops.length, towerPx=CONE_H + n*STEP + RY + 30, scale=Math.min(1, 360/towerPx);
  g.save(); g.translate(sw/2, 496); g.scale(scale, scale);
  drawCone(0,0);
  for(var i=0;i<n;i++){ drawScoop(scoops[i].x-W/2, (-CONE_H+18)-i*STEP, scoops[i].s, i===n-1); }
  g.restore();
  ctx=keep;
  g.fillStyle="#fff"; g.font="700 72px 'Cormorant Garamond', serif"; g.fillText(String(score), sw/2, 588);
  g.fillStyle="#e9cf94"; g.font="500 15px Jost, sans-serif"; g.fillText("SCOOPS STACKED", sw/2, 614);
  g.fillStyle="rgba(255,255,255,.82)"; g.font="400 17px Jost, sans-serif"; g.fillText("Can you beat me? 🍦", sw/2, 662);
  g.fillStyle="rgba(233,207,148,.9)"; g.font="500 15px Jost, sans-serif"; g.fillText("bonbonicecreams.com", sw/2, 696);
  c2.toBlob(function(blob){
    if(!blob)return;
    var file=new File([blob],"bonbon-scoop-tower.png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:"Bon Bon Scoop Stacker", text:"I stacked "+score+" scoops at Bon Bon! 🍦"}).catch(function(){});
    } else {
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bonbon-scoop-tower.png"; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
    }
  },"image/png");
}

document.addEventListener("pointerdown",function(e){if(e.target.closest(".pill"))return;if(running&&!toppling)drop();});
resize();
</script>
</body></html>
