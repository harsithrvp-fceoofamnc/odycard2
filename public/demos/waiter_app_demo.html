<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odysra Waiter App — Demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9ebee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 12px;color:#23262b}
  .hint{font-size:13px;color:#6b7280;margin:0 0 12px;text-align:center;max-width:380px}
  .phone{position:relative;width:360px;max-width:100%;height:720px;background:#f6f7f9;border-radius:30px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22);border:1px solid #d6d9de;display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:10px;padding:16px 16px;background:linear-gradient(180deg,#5c3a1c,#3e2713);color:#f4ecdb}
  .hdr .logo{width:34px;height:34px;border-radius:9px;background:#c79233;color:#3a2a05;display:flex;align-items:center;justify-content:center;font-weight:800}
  .hdr h1{font-size:15px;margin:0;font-weight:700}
  .hdr .sub{font-size:11.5px;opacity:.85}
  .screen{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
  .login .who{font-size:14px;color:#6b7280}
  .login h2{margin:0;font-size:20px;font-weight:800}
  .picklist{display:flex;flex-direction:column;gap:10px;width:252px;margin-top:4px}
  .pickbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1.5px solid #e2c79a;border-radius:14px;padding:13px 15px;cursor:pointer;text-align:left}
  .pickbtn b{font-size:16px}
  .pickbtn span{font-size:12px;color:#6b7280}
  .pickbtn:active{background:#f0e7d4}
  .lback{position:absolute;top:12px;left:12px;background:none;border:0;color:#7a4a24;font-weight:700;font-size:14px;cursor:pointer}
  .dots{display:flex;gap:12px;margin:4px 0 6px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid #c79233}
  .dot.f{background:#c79233}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:230px}
  .pad button{height:56px;border:1px solid #ddd;background:#fff;border-radius:14px;font-size:22px;font-weight:700;cursor:pointer}
  .pad button:active{background:#f0e7d4}
  .loginhint{font-size:12px;color:#9aa0a8;text-align:center}
  .bar{display:flex;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #ececec;align-items:center;flex-wrap:wrap}
  .bar .you{font-weight:800;font-size:14px}
  .bar .zone{font-size:12px;color:#6b7280}
  .tg{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .tg button{font-size:11.5px;font-weight:700;border:1px solid #d9dde2;background:#fff;color:#555;border-radius:14px;padding:5px 9px;cursor:pointer}
  .tg button.on{background:#1d7d74;border-color:#1d7d74;color:#fff}
  .sim{margin:12px 14px 4px;padding:13px;background:#7a4a24;color:#fff;border:0;border-radius:13px;font-size:14.5px;font-weight:800;cursor:pointer}
  .sim:active{transform:scale(.98)}
  .list{flex:1;overflow-y:auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .empty{color:#9aa0a8;text-align:center;padding:40px 10px;font-size:14px}
  .card{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;animation:pop .2s ease;border-left:5px solid #28b463}
  .card.exp{border-left-color:#c79233;background:#fdf7ea}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .exptag{font-size:10.5px;font-weight:800;color:#8a5a1c;background:rgba(199,146,51,.18);padding:2px 8px;border-radius:12px;align-self:flex-start}
  .card .tbl{font-size:18px;font-weight:800}
  .card .it{font-size:14px;color:#3a3f47}
  .card .meta{font-size:11.5px;color:#9aa0a8}
  .card .done{margin-top:2px;background:#28b463;color:#fff;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:800;cursor:pointer}
  .card .done:active{transform:scale(.98)}
  .toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#23262b;color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:.95}
</style>
</head>
<body>
<p class="hint">One app for the whole team. Tap your name → enter your PIN → you see only your zone. Then tap “Simulate ready order”.</p>
<div class="phone">
  <div class="hdr"><div class="logo">A</div><div><h1>Odysra · Waiter</h1><div class="sub">Annapoorna · RS Puram</div></div></div>
  <div class="screen" id="screen"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
var WAITERS=[
  {name:"Ravi",zone:"Zone B",tables:"9–16",lo:9,hi:16,pin:"1234"},
  {name:"Suresh",zone:"Zone A",tables:"1–8",lo:1,hi:8,pin:"1111"},
  {name:"Priya",zone:"Zone C",tables:"17–24",lo:17,hi:24,pin:"2222"}
];
var me=null,entered="",soundOn=true,voiceOn=false,orders=[],seq=0;
var screen=document.getElementById("screen"),toast=document.getElementById("toast");
var ITEMS=[["Masala Dosa ×2",false],["Filter Coffee ×1",false],["Veg Biriyani ×1",false],["Naan ×2","reorder"],["Chapati ×2",false],["Gulab Jamun ×2",false],["Paneer Butter Masala ×1",false]];

function show(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show");},1400);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

/* sounds (Web Audio, no files) */
var actx=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(freq,start,dur,type){if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,actx.currentTime+start);g.gain.exponentialRampToValueAtTime(0.5,actx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+start+dur);o.start(actx.currentTime+start);o.stop(actx.currentTime+start+dur+0.02);}
function chime(exp){if(!soundOn)return;ensureAudio();if(exp){tone(880,0,0.12,"square");tone(880,0.16,0.12,"square");tone(1175,0.32,0.18,"square");}else{tone(784,0,0.14);tone(1047,0.16,0.22);}}
function buzz(exp){try{if(navigator.vibrate)navigator.vibrate(exp?[80,60,80,60,120]:[120]);}catch(e){}}
function speak(t){if(!voiceOn)return;try{var u=new SpeechSynthesisUtterance(t);u.rate=1;speechSynthesis.speak(u);}catch(e){}}

/* login: pick who you are, then PIN */
function renderPick(){
  me=null;entered="";
  var btns=WAITERS.map(function(w,i){return '<button class="pickbtn" onclick="pickMe('+i+')"><b>'+w.name+'</b><span>'+w.zone+' · Tables '+w.tables+'</span></button>';}).join("");
  screen.innerHTML='<div class="login"><div class="who">Annapoorna · RS Puram</div><h2>Who’s serving?</h2><div class="picklist">'+btns+'</div><div class="loginhint">One app for all waiters — tap your name</div></div>';
}
function pickMe(i){me=WAITERS[i];entered="";renderPin();}
function renderPin(){
  var dots="";for(var i=0;i<4;i++)dots+='<span class="dot'+(i<entered.length?' f':'')+'"></span>';
  var keys=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(function(k){
    if(k==="")return '<button style="visibility:hidden"></button>';
    if(k==="⌫")return '<button onclick="key(\'del\')">⌫</button>';
    return '<button onclick="key(\''+k+'\')">'+k+'</button>';
  }).join("");
  screen.innerHTML='<div class="login"><button class="lback" onclick="renderPick()">‹ Not you?</button><div class="who">'+me.name+' · '+me.zone+'</div><h2>Enter your PIN</h2><div class="dots">'+dots+'</div><div class="pad">'+keys+'</div><div class="loginhint">Supervisor sets this PIN · demo: '+me.pin+'</div></div>';
}
function key(k){
  if(k==="del"){entered=entered.slice(0,-1);}else if(entered.length<4){entered+=k;}
  if(entered.length===4){
    if(entered===me.pin){ensureAudio();renderMain();return;}
    show("Wrong PIN");entered="";renderPin();return;
  }
  renderPin();
}

/* main */
function renderMain(){
  screen.innerHTML='<div class="bar"><div><div class="you">'+me.name+'</div><div class="zone">'+me.zone+' · Tables '+me.tables+'</div></div>'+
    '<div class="tg"><button id="snd" class="on" onclick="toggleSnd()">🔊 Sound</button><button id="vc" onclick="toggleVoice()">🗣 Voice</button><button onclick="logout()">Logout</button></div></div>'+
    '<button class="sim" onclick="simulate()">🔔 Simulate ready order (kitchen)</button>'+
    '<div class="list" id="list"></div>';
  renderList();
}
function logout(){orders=[];renderPick();}
function toggleSnd(){soundOn=!soundOn;document.getElementById("snd").classList.toggle("on",soundOn);}
function toggleVoice(){voiceOn=!voiceOn;document.getElementById("vc").classList.toggle("on",voiceOn);if(voiceOn)speak("Voice on");}
function renderList(){
  var l=document.getElementById("list");if(!l)return;
  var sorted=orders.slice().sort(function(a,b){if(a.exp!==b.exp)return a.exp?-1:1;return a.t-b.t;});
  if(!sorted.length){l.innerHTML='<div class="empty">No tables to serve right now.<br>Tap the button above to simulate one.</div>';return;}
  l.innerHTML=sorted.map(function(o){
    return '<div class="card'+(o.exp?' exp':'')+'">'+(o.exp?'<span class="exptag">⚡ ORDERED AGAIN · serve quickly</span>':'')+
      '<div class="tbl">Table '+o.tbl+'</div><div class="it">'+o.item+'</div><div class="meta">Ready just now · '+me.zone+'</div>'+
      '<button class="done" onclick="served('+o.id+')">Served ✓</button></div>';
  }).join("");
}
function simulate(){
  var it=rnd(ITEMS),exp=it[1]==="reorder";
  var tbl=me.lo+Math.floor(Math.random()*(me.hi-me.lo+1));
  var o={id:++seq,tbl:tbl,item:it[0],exp:exp,t:Date.now()};
  orders.unshift(o);
  chime(exp);buzz(exp);speak("Table "+tbl+(exp?", ordered again, serve quickly":", ready"));
  renderList();show(exp?"⚡ Ordered again — Table "+tbl:"Serve Table "+tbl);
}
function served(id){orders=orders.filter(function(o){return o.id!==id;});renderList();show("Marked served");}
renderPick();
</script>
</body>
</html>
