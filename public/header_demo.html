<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon Bon — new header</title>
<style>
  :root{--maroon:#7a1121;--dark:#5a0c1a;--cream:#faf2f1;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
  .phone{width:100%;max-width:430px;background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 0 44px rgba(0,0,0,.5)}

  .hdr{position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;padding:14px 12px 24px;
    background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.34)),url('wood_web.jpg') center/cover;
    box-shadow:inset 0 -10px 20px rgba(0,0,0,.4), inset 0 6px 14px rgba(255,255,255,.05);}
  .sign{width:50%;max-width:225px;display:block;animation:glow 3.8s ease-in-out infinite;}
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,.28)) drop-shadow(0 0 9px rgba(255,225,235,.12)) drop-shadow(0 3px 5px rgba(0,0,0,.45));}
    50%{filter:drop-shadow(0 0 6px rgba(255,255,255,.45)) drop-shadow(0 0 15px rgba(255,205,225,.22)) drop-shadow(0 3px 5px rgba(0,0,0,.45));}}
  .langpill{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
    color:#fff;border:1px solid rgba(255,255,255,.42);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;letter-spacing:.5px;
    box-shadow:0 3px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.3);}
  .langpill:hover{background:rgba(255,255,255,.26)}
  .langpill svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* awning: single static image right below the wood — no animation */
  .awn-wrap{position:relative;z-index:2;width:130%;margin:-14px 0 0 -15%;line-height:0}
  .awn{width:100%;display:block}

  .chat{padding:22px 16px 8px;background:var(--cream)}
  .row{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--maroon),var(--dark));flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:17px}
  .bub{background:#fff;border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:14.5px;color:#2a1212;box-shadow:0 1px 4px rgba(0,0,0,.06);line-height:1.4}
  .foot{text-align:center;font-size:11px;color:#9a8585;padding:10px}
</style></head>
<body>
  <div class="phone">
    <div class="hdr">
      <img class="sign" src="logo_web.png" alt="Bon Bon Ice Creams">
      <button class="langpill" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.3"/><path d="M2.7 12h18.6"/><path d="M12 2.7a14 14 0 0 1 3.7 9.3 14 14 0 0 1-3.7 9.3 14 14 0 0 1-3.7-9.3A14 14 0 0 1 12 2.7Z"/></svg></button>
    </div>
    <div class="awn-wrap">
      <img class="awn" src="awning_web.png" alt="awning">
    </div>

    <div class="chat">
      <div class="row"><div class="av">🍦</div><div class="bub">Hi! 🍦 Welcome to Bon Bon Ice Creams — what are you craving today?</div></div>
      <div class="row"><div class="av">🍦</div><div class="bub">Here are some of our favourites 🍨👇</div></div>
    </div>
    <div class="foot">Demo prototype · simulated AI &amp; payment · © Odysra</div>
  </div>
</body></html>
