<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIT Food Court — Odysra</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08080a;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
.serif{font-family:Georgia,"Times New Roman",serif}

.app{max-width:440px;height:100dvh;margin:0 auto;background:#f2f3f6;display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.7)}

/* ---------------- header ---------------- */
.hdr{flex:0 0 auto;background:#fff;border-bottom:1px solid #e9eaee;padding:11px 14px 0}
.hrow{display:flex;align-items:center;gap:10px;padding-bottom:11px}
.logo{width:31px;height:31px;border-radius:9px;background:#16171a;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.04em}
.htxt b{font-size:14px;font-weight:700;color:#16131a;display:block;line-height:1.2;letter-spacing:-.01em}
.htxt span{font-size:10.5px;color:#9297a1}
.open{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#0e7a55;background:#e6f5ee;
  padding:5px 9px;border-radius:20px}
.tabs{display:flex;gap:26px}
.tab{background:0;border:0;font-family:inherit;font-size:13.5px;font-weight:600;color:#9297a1;
  padding:0 0 10px;cursor:pointer;position:relative;letter-spacing:-.01em}
.tab.on{color:#16131a;font-weight:700}
.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#16131a;border-radius:2px}

/* ---------------- body ---------------- */
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block}

/* ---------------- ASK ---------------- */
#ask{padding:18px 14px 8px}
.greet{display:flex;gap:10px;margin-bottom:4px}
.av{width:30px;height:30px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,#8a1530,#c04664);
  display:flex;align-items:center;justify-content:center}
.msg{background:#fff;border-radius:17px;border-top-left-radius:6px;padding:13px 15px;font-size:14.5px;
  line-height:1.55;color:#1d1f25;box-shadow:0 1px 2px rgba(20,20,40,.05);max-width:88%;
  animation:up .42s cubic-bezier(.2,.8,.2,1) both}
.msg b{font-weight:700}
.you{background:#16171a;color:#fff;border-radius:17px;border-top-right-radius:6px;padding:11px 15px;
  font-size:14px;margin:16px 0 0 auto;width:fit-content;max-width:82%;
  animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.typing{display:flex;gap:5px;padding:16px 15px;width:fit-content}
.typing i{width:6px;height:6px;border-radius:50%;background:#c4c8d0;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.28}30%{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

.picks{display:flex;gap:9px;overflow-x:auto;padding:12px 14px 2px;margin:0 -14px;scrollbar-width:none;scroll-snap-type:x mandatory}
.picks::-webkit-scrollbar{display:none}
.pick{flex:0 0 154px;background:#fff;border-radius:16px;overflow:hidden;scroll-snap-align:start;
  box-shadow:0 1px 2px rgba(20,20,40,.05),0 8px 22px rgba(20,20,40,.05);
  animation:up .48s cubic-bezier(.2,.8,.2,1) both}
.pick .im{height:66px;display:flex;align-items:flex-start;justify-content:space-between;padding:7px}
.pick .tag{font-size:8px;font-weight:800;letter-spacing:.09em;color:#fff;background:rgba(0,0,0,.34);
  padding:3px 7px;border-radius:20px}
.pick .bd{padding:9px 11px 11px}
.pick .nm{font-size:12.5px;font-weight:700;color:#16131a;line-height:1.3;height:32px;overflow:hidden}
.pick .ft{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.pick .pr{font-size:13.5px;font-weight:800;color:#16131a}
.add{border:0;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;
  font-family:inherit;transition:.15s;white-space:nowrap}
.add:active{transform:scale(.93)}
.add.on{background:#0e7a55 !important}

/* ---------------- STALLS ---------------- */
.sec{scroll-snap-align:start}
.front{position:relative;height:300px;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 24px}
.eye{font-size:8.5px;letter-spacing:.26em;position:relative;z-index:2}
.tl{font-size:8.5px;letter-spacing:.2em;position:relative;z-index:2}
.arrow{position:absolute;bottom:16px;font-size:15px;z-index:2;animation:bob 1.9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(7px);opacity:1}}

/* Bon Bon — wood + awning */
.f1{background:
  repeating-linear-gradient(91deg,rgba(0,0,0,.22) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(88deg,rgba(255,255,255,.045) 0 2px,transparent 2px 11px),
  linear-gradient(165deg,#6b3d21,#3f2110)}
.f1:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 34%,rgba(255,214,170,.2),transparent 62%)}
.awn{position:absolute;top:0;left:0;right:0;height:26px;z-index:2;
  background:repeating-linear-gradient(90deg,#f7e6ea 0 16px,#8a1530 16px 32px)}
.awn:after{content:"";position:absolute;top:26px;left:0;right:0;height:9px;
  background:repeating-linear-gradient(90deg,#f7e6ea 0 16px,#8a1530 16px 32px);
  -webkit-mask:radial-gradient(circle at 8px 0,#000 8px,transparent 8.5px) 0 0/16px 9px;
  mask:radial-gradient(circle at 8px 0,#000 8px,transparent 8.5px) 0 0/16px 9px}
.f1 .eye{color:#eccf92}
.f1 .nm2{font-size:42px;color:#fff;margin-top:10px;position:relative;z-index:2;line-height:.95;
  text-shadow:0 2px 20px rgba(0,0,0,.45)}
.f1 .rule{width:40px;height:1px;background:#eccf92;margin:14px 0;position:relative;z-index:2}
.f1 .tl{color:#eddcaa}.f1 .arrow{color:#eddcaa}

/* D'vour — chalkboard */
.f2{background:radial-gradient(ellipse at 50% 40%,#242424,#111 78%)}
.f2:after{content:"";position:absolute;inset:0;opacity:.7;
  background:repeating-radial-gradient(circle at 17% 24%,rgba(255,255,255,.05) 0 1px,transparent 1px 11px),
             repeating-radial-gradient(circle at 74% 66%,rgba(255,255,255,.04) 0 1px,transparent 1px 16px),
             repeating-radial-gradient(circle at 44% 86%,rgba(255,255,255,.03) 0 1px,transparent 1px 9px)}
.frame{position:absolute;inset:11px;border:2px solid #f4f2ed;border-radius:2px;opacity:.9;z-index:2}
.f2 .eye{color:#8d8d8d}
.f2 .box{border:2.5px solid #fff;padding:9px 20px;margin-top:11px;position:relative;z-index:2}
.f2 .box div{font-size:31px;color:#fff;letter-spacing:.07em;line-height:1;font-weight:500}
.f2 .tl{color:#cbc8c1;margin-top:13px}.f2 .arrow{color:#cbc8c1}

/* Kimchi — green */
.f3{background:radial-gradient(ellipse at 50% 36%,#27714a,#123f27 80%)}
.f3:after{content:"";position:absolute;inset:0;opacity:.55;
  background:repeating-linear-gradient(58deg,rgba(255,255,255,.05) 0 2px,transparent 2px 26px),
             repeating-linear-gradient(-58deg,rgba(255,255,255,.04) 0 2px,transparent 2px 31px)}
.seal{width:44px;height:44px;border-radius:50%;background:#d3362c;position:relative;z-index:2;margin-top:10px;
  box-shadow:0 0 0 5px rgba(211,54,44,.18)}
.f3 .eye{color:#a9d6bb}
.f3 .nm2{font-size:27px;color:#fff;margin-top:13px;position:relative;z-index:2;line-height:1.15}
.f3 .tl{background:#d3362c;color:#fff;padding:4px 11px;margin-top:11px}
.f3 .arrow{color:#a9d6bb}

.items{padding:14px 14px 24px;background:#f2f3f6}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:12px 13px;
  margin-bottom:8px;box-shadow:0 1px 2px rgba(20,20,40,.045)}
.row .l{flex:1;min-width:0}
.row .n{font-size:13.5px;font-weight:700;color:#16131a;display:flex;align-items:center;gap:7px;line-height:1.3}
.row .d{font-size:11px;color:#9297a1;margin-top:4px;line-height:1.45}
.row .p{font-size:13.5px;font-weight:800;color:#16131a;margin-top:6px}
.veg,.non{width:12px;height:12px;border-radius:2px;border:1.5px solid #0e7a55;position:relative;flex:0 0 auto}
.non{border-color:#c0392b}
.veg:after,.non:after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:#0e7a55}
.non:after{background:#c0392b}

/* ---------------- composer ---------------- */
.composer{flex:0 0 auto;background:#fff;border-top:1px solid #e9eaee;padding:9px 12px calc(11px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #e7e8ec;background:#fafbfc;border-radius:20px;padding:8px 13px;
  font-size:12.5px;font-weight:600;color:#41454d;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.hot{background:#fbeef1;border-color:#f2d8df;color:#8a1530;font-weight:700}
.inputrow{display:flex;gap:7px;align-items:center}
.inputrow input{flex:1;border:1px solid #e7e8ec;border-radius:22px;padding:11px 15px;font-size:14.5px;
  font-family:inherit;background:#f7f8fa;color:#16131a;outline:none;min-width:0}
.inputrow input:focus{border-color:#c9ccd3;background:#fff}
.ib{width:40px;height:40px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.mic{background:#f2f3f5}.send{background:#16171a}

/* ---------------- cart ---------------- */
.cartbar{position:absolute;left:12px;right:12px;bottom:0;z-index:30;background:#16171a;border-radius:15px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;transition:.34s cubic-bezier(.2,.85,.25,1);
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
.cartbar.hide{transform:translateY(150%);opacity:0}
.cartbar .c{flex:1;color:#fff;min-width:0}
.cartbar .c b{font-size:14px;font-weight:700;display:block}
.cartbar .c span{font-size:10.5px;color:#95979f}
.cartbar button{border:0;border-radius:10px;background:#fff;color:#16171a;padding:10px 17px;
  font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}

.scrim{position:absolute;inset:0;background:rgba(10,9,12,.55);backdrop-filter:blur(3px);z-index:60;
  opacity:0;pointer-events:none;transition:.26s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#f2f3f6;border-radius:24px 24px 0 0;
  padding:9px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:.36s cubic-bezier(.2,.85,.25,1);max-height:90%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:4px;background:#d3d6dc;margin:0 auto 15px}
.sheet h2{font-size:20px;font-weight:800;letter-spacing:-.025em;color:#16131a}
.sub2{font-size:12.5px;color:#9297a1;margin:3px 0 16px;line-height:1.5}
.grp{margin-bottom:12px}
.gh{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:#71767f;margin-bottom:7px}
.dot{width:8px;height:8px;border-radius:3px}
.ci{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:6px}
.ci .q{font-size:11.5px;font-weight:800;color:#fff;border-radius:7px;padding:4px 8px}
.ci .nn{flex:1;font-size:13px;font-weight:600;color:#16131a;line-height:1.35}
.ci .pp{font-size:13px;font-weight:800;color:#16131a}
.tot{display:flex;justify-content:space-between;align-items:center;padding:15px 2px 2px;
  border-top:1px dashed #d6d9df;margin-top:8px}
.tl2{font-size:13.5px;color:#71767f;font-weight:600}
.tv{font-size:23px;font-weight:800;color:#16131a;letter-spacing:-.02em}
.pay{width:100%;border:0;border-radius:14px;background:#16171a;color:#fff;padding:15px;font-size:15.5px;
  font-weight:800;cursor:pointer;margin-top:15px;font-family:inherit}

.tok{text-align:center;padding:12px 4px 2px}
.ok{width:54px;height:54px;border-radius:50%;background:#e6f5ee;display:flex;align-items:center;
  justify-content:center;margin:0 auto 14px;animation:pop .5s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes pop{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:none}}
.tok h3{font-size:20px;font-weight:800;color:#16131a;letter-spacing:-.02em}
.pp2{font-size:13px;color:#71767f;margin-top:6px;line-height:1.55}
.tokbox{background:#16171a;border-radius:19px;padding:24px;margin:18px 0 14px}
.lb{font-size:9.5px;font-weight:800;letter-spacing:.18em;color:#8a8d95}
.nu{font-size:58px;font-weight:800;color:#fff;letter-spacing:.16em;margin-top:7px;
  font-variant-numeric:tabular-nums;line-height:1}
.hint2{font-size:11.5px;color:#8a8d95;margin-top:11px}
.done{width:100%;border:1px solid #e0e2e7;border-radius:13px;background:#fff;color:#41454d;padding:13px;
  font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="hrow">
      <div class="logo">O</div>
      <div class="htxt"><b>VIT Food Court</b><span>Three stalls · one order</span></div>
      <div class="open">OPEN</div>
    </div>
    <div class="tabs">
      <button class="tab on" id="t1" onclick="go('ask')">Ask</button>
      <button class="tab" id="t2" onclick="go('stalls')">Stalls</button>
    </div>
  </div>

  <div class="body" id="body">
    <div class="view on" id="ask"></div>
    <div class="view" id="stalls"></div>
  </div>

  <div class="cartbar hide" id="bar">
    <div class="c"><b id="bn">0 items</b><span id="bs">from 0 stalls</span></div>
    <button onclick="openCart()">View cart</button>
  </div>

  <div class="composer" id="comp">
    <div class="chips">
      <button class="chip hot" onclick="ask('Something spicy')">🌶️ Spicy</button>
      <button class="chip" onclick="ask('Under ₹200')">Under ₹200</button>
      <button class="chip" onclick="ask('Veg only')">Veg only</button>
      <button class="chip" onclick="ask('Something sweet')">Something sweet</button>
      <button class="chip" onclick="ask('Surprise me')">Surprise me</button>
    </div>
    <div class="inputrow">
      <input id="inp" placeholder="Enakku edhachu kaaramma venum…" onkeydown="if(event.key==='Enter')ask(this.value)">
      <button class="ib mic" onclick="ask('Surprise me')" aria-label="Speak">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6c7280" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="ib send" onclick="ask(document.getElementById('inp').value)" aria-label="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5.5l6.5 6.5-6.5 6.5"/></svg>
      </button>
    </div>
  </div>

  <div class="scrim" id="scrim" onclick="closeAll()"></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
const B={
  bonbon:{n:"Bon Bon",c:"#8a1530"},
  dvour:{n:"D'vour",c:"#1f1f22"},
  kimchi:{n:"Kim Chi & Ramen",c:"#1d5c39"}
};
const M={
  dbc:{n:"Death by Chocolate",d:"Loaded sundae — our best seller",p:210,b:"bonbon",v:1},
  waffle:{n:"Belgian Waffle with Ice Cream",d:"Hot waffle, Nutella, fruits & honey",p:250,b:"bonbon",v:1},
  brownie:{n:"Hot Brownie Sizzler",d:"Warm brownie, cold scoop, chocolate sauce",p:210,b:"bonbon",v:1},
  falooda:{n:"Royal Falooda",d:"Rose, noodles, nuts & ice cream",p:180,b:"bonbon",v:1},
  shake:{n:"Thick Chocolate Shake",d:"Thick, cold, ridiculous",p:160,b:"bonbon",v:1},

  korean:{n:"Korean Burger",d:"Kimchi crunch, gochujang mayo, soft bun",p:230,b:"dvour",v:1},
  nashville:{n:"Nashville Chicken Burger",d:"Crispy chicken, tangy pickles, fiery southern bite",p:250,b:"dvour",v:0},
  cheesef:{n:"Cheesy French Fries",d:"Smothered in rich melted cheese sauce",p:150,b:"dvour",v:1},
  wings:{n:"Buffalo Wings",d:"Tangy buffalo sauce, blue cheese dip",p:220,b:"dvour",v:0},
  dunk:{n:"Cheese Dunk Burger",d:"Loaded with cheese, built to dunk",p:270,b:"dvour",v:1},
  mexrice:{n:"Mexican Rice (Veg)",d:"Golden seared paneer, sweet corn, bell peppers",p:180,b:"dvour",v:1},

  ramen:{n:"Paneer Ramen",d:"Japanese-style noodles in a flavourful broth",p:220,b:"kimchi",v:1},
  momos:{n:"Korean Veg Momos",d:"Steamed dumplings, Korean spices, gochujang dip",p:150,b:"kimchi",v:1},
  kimchir:{n:"Kimchi Rice",d:"Spicy fried rice with kimchi & Asian seasoning",p:220,b:"kimchi",v:1},
  bao:{n:"Paneer Bao Classic",d:"Soft fluffy bao, spiced paneer, creamy sauce",p:160,b:"kimchi",v:1},
  honey:{n:"Honey Paneer",d:"Tossed in a sweet & mildly spicy honey glaze",p:220,b:"kimchi",v:1},
  nasi:{n:"Nasi Goreng",d:"Indonesian fried rice, aromatic spices, crispy crackers",p:240,b:"kimchi",v:1}
};
const A={
  "Something spicy":{r:"Kaaram venuma? 🌶️ These three bring real heat — the Korean Burger has proper gochujang kick.",ids:["korean","kimchir","wings"]},
  "Under ₹200":{r:"Best value going right now — all under ₹200 and genuinely filling.",ids:["cheesef","momos","bao"]},
  "Veg only":{r:"All veg. 🌱 The Paneer Ramen is the one people come back for.",ids:["ramen","dunk","honey"]},
  "Something sweet":{r:"Dessert first? Respect. 🍨 Death by Chocolate is the crowd favourite tonight.",ids:["dbc","waffle","brownie"]},
  "Surprise me":{r:"Trust me — one from each stall. Burger, ramen, and something cold to finish. 😎",ids:["korean","ramen","dbc"]}
};
const cart={};
const $=id=>document.getElementById(id);
const money=n=>"₹"+n.toLocaleString("en-IN");
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.keys(cart).reduce((t,k)=>t+cart[k]*M[k].p,0);
function stalls(){const s=new Set();Object.keys(cart).forEach(k=>{if(cart[k])s.add(M[k].b)});return s.size}

/* ---------- views ---------- */
function go(v){
  ["ask","stalls"].forEach(x=>$(x).classList.toggle("on",x===v));
  $("t1").classList.toggle("on",v==="ask");
  $("t2").classList.toggle("on",v==="stalls");
  $("comp").style.display=v==="ask"?"":"none";
  $("body").scrollTop=0;
}

/* ---------- ask ---------- */
$("ask").innerHTML=`<div class="greet">
  <div class="av"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L18.7 9.7 13.8 11.5 12 16.4 10.2 11.5 5.3 9.7 10.2 7.9z"/></svg></div>
  <div class="msg">Hey! 👋 Three stalls here — <b>Bon Bon</b>, <b>D'vour</b> and <b>Kim Chi &amp; Ramen</b>. Tell me what you're feeling and I'll pull the best of all three. One cart, one token, no queue.</div></div>`;

function card(id,d){
  const m=M[id],b=B[m.b];
  return `<div class="pick" style="animation-delay:${d}s">
    <div class="im" style="background:${b.c}"><span class="tag">${b.n}</span></div>
    <div class="bd"><div class="nm">${m.n}</div>
      <div class="ft"><span class="pr">${money(m.p)}</span>
      <button class="add" style="background:${b.c}" onclick="addItem('${id}',this)">Add</button></div></div></div>`;
}
let busy=false;
function ask(q){
  q=(q||"").trim(); if(!q||busy)return;
  busy=true; go("ask");
  const box=$("ask");
  box.insertAdjacentHTML("beforeend",`<div class="you">${q}</div>`);
  $("inp").value="";
  const t=document.createElement("div");
  t.className="greet";
  t.innerHTML=`<div class="av"></div><div class="msg typing"><i></i><i></i><i></i></div>`;
  box.appendChild(t);
  $("body").scrollTop=$("body").scrollHeight;
  setTimeout(()=>{
    const a=A[A[q]?q:key(q)];
    t.remove();
    box.insertAdjacentHTML("beforeend",
      `<div class="greet"><div class="av"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L18.7 9.7 13.8 11.5 12 16.4 10.2 11.5 5.3 9.7 10.2 7.9z"/></svg></div><div class="msg">${a.r}</div></div>
       <div class="picks">${a.ids.map((id,i)=>card(id,i*.07)).join("")}</div>`);
    $("body").scrollTop=$("body").scrollHeight;
    busy=false;
  },850);
}
function key(q){
  const s=q.toLowerCase();
  if(/spic|kaara|hot|chilli|masala/.test(s))return "Something spicy";
  if(/sweet|dessert|ice|sooda|cold/.test(s))return "Something sweet";
  if(/veg|paneer/.test(s))return "Veg only";
  if(/cheap|budget|200|less|money/.test(s))return "Under ₹200";
  return "Surprise me";
}

/* ---------- stalls ---------- */
const FRONTS=[
 {id:"bonbon",cls:"f1",items:["dbc","waffle","brownie","falooda","shake"],
  html:`<div class="awn"></div><div class="eye">STALL 01</div>
        <div class="nm2 serif">Bon Bon</div><div class="rule"></div>
        <div class="tl">BUTTER CRAFTED ICE CREAMS</div><div class="arrow">⌄</div>`},
 {id:"dvour",cls:"f2",items:["korean","nashville","cheesef","wings","dunk","mexrice"],
  html:`<div class="frame"></div><div class="eye">STALL 02</div>
        <div class="box"><div>D'VOUR</div></div>
        <div class="tl">SAVOUR THE SPEED</div><div class="arrow">⌄</div>`},
 {id:"kimchi",cls:"f3",items:["ramen","momos","kimchir","bao","honey","nasi"],
  html:`<div class="eye">STALL 03</div><div class="seal"></div>
        <div class="nm2">Kim Chi &amp; Ramen</div>
        <div class="tl">INDO ASIAN FOOD</div><div class="arrow">⌄</div>`}
];
function rowHtml(id){
  const m=M[id],b=B[m.b];
  return `<div class="row"><div class="l">
    <div class="n"><span class="${m.v?'veg':'non'}"></span>${m.n}</div>
    <div class="d">${m.d}</div><div class="p">${money(m.p)}</div></div>
    <button class="add" style="background:${b.c}" onclick="addItem('${id}',this)">Add</button></div>`;
}
$("stalls").innerHTML=FRONTS.map(f=>
  `<div class="sec"><div class="front ${f.cls}">${f.html}</div>
   <div class="items">${f.items.map(rowHtml).join("")}</div></div>`).join("");

/* ---------- cart ---------- */
function addItem(id,btn){
  cart[id]=(cart[id]||0)+1;
  const o=btn.textContent;
  btn.textContent="Added ✓";btn.classList.add("on");
  setTimeout(()=>{btn.textContent="Add";btn.classList.remove("on")},850);
  sync();
}
function sync(){
  const c=count();
  $("bn").textContent=c+(c===1?" item · ":" items · ")+money(total());
  const s=stalls();
  $("bs").textContent="from "+s+(s===1?" stall":" stalls");
  $("bar").classList.toggle("hide",c===0);
}
function openCart(){
  const g={};
  Object.keys(cart).filter(k=>cart[k]>0).forEach(k=>{(g[M[k].b]=g[M[k].b]||[]).push(k)});
  let h='<div class="grab"></div><h2>Your order</h2><div class="sub2">One payment, one token. Collect from each stall.</div>';
  Object.keys(g).forEach(b=>{
    h+=`<div class="grp"><div class="gh"><span class="dot" style="background:${B[b].c}"></span>${B[b].n}</div>`;
    g[b].forEach(k=>{h+=`<div class="ci"><span class="q" style="background:${B[b].c}">${cart[k]}×</span><span class="nn">${M[k].n}</span><span class="pp">${money(cart[k]*M[k].p)}</span></div>`});
    h+=`</div>`;
  });
  h+=`<div class="tot"><span class="tl2">Total</span><span class="tv">${money(total())}</span></div>
      <button class="pay" onclick="payNow()">Pay ${money(total())}</button>`;
  show(h);
}
function payNow(){
  const tk=String(Math.floor(1000+Math.random()*9000));
  show(`<div class="grab"></div><div class="tok">
    <div class="ok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0e7a55" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
    <h3>Payment received</h3>
    <div class="pp2">Read this out to the cashier — they'll pull up your order and print the bill.</div>
    <div class="tokbox"><div class="lb">YOUR TOKEN</div><div class="nu">${tk}</div>
      <div class="hint2">${count()} items · ${money(total())} · ${stalls()} stalls</div></div>
    <button class="done" onclick="closeAll()">Done</button></div>`);
}
function show(h){$("sheet").innerHTML=h;$("sheet").classList.add("on");$("scrim").classList.add("on")}
function closeAll(){$("sheet").classList.remove("on");$("scrim").classList.remove("on")}
</script>
