<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find what's for me — Demo</title>
<style>
  :root{--blue:#7a4a24;--ink:#33281a;--mut:#9c8e76;--line:#e7dcc5;--cream:#f4ecdb;--gold:#c79233;--card:#fffdf7}
  *{box-sizing:border-box}
  body{margin:0;background:#e9ebee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:22px 12px;color:var(--ink)}
  .hint{font-size:13px;color:#6b7280;margin:0 0 14px;max-width:380px;text-align:center}
  .phone{position:relative;width:390px;max-width:100%;height:780px;background:#efe7d6;border-radius:30px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22);border:1px solid #d8cdb6;display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:linear-gradient(180deg,#5c3a1c,#3e2713);color:#f4ecdb}
  .hdr .mark{width:34px;height:34px;border-radius:9px;background:#c79233;color:#3a2a05;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
  .hdr h1{font-size:15px;margin:0;font-weight:700}
  .hdr .sub{font-size:11.5px;opacity:.8}
  .langbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#4d3017;scrollbar-width:none;-ms-overflow-style:none}
  .langbar::-webkit-scrollbar{display:none;width:0;height:0}
  .langbar button{flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#f4ecdb;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:16px;cursor:pointer;white-space:nowrap}
  .langbar button.on{background:#c79233;color:#3a2a05;border-color:#c79233}
  #chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
  #chat::-webkit-scrollbar{display:none}
  .msg{max-width:82%;padding:10px 13px;font-size:14.5px;line-height:1.45;border-radius:15px}
  .bot{background:var(--card);border:1px solid var(--line);border-radius:15px 15px 15px 5px;align-self:flex-start}
  .me{background:#7a4a24;color:#f7ecd9;border-radius:15px 15px 5px 15px;align-self:flex-end}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
  .chip{font-size:13.5px;background:var(--card);border:1.4px solid var(--gold);color:var(--blue);padding:8px 13px;border-radius:20px;cursor:pointer;font-weight:600}
  .chip.alt{border-color:var(--line);color:var(--mut)}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-self:stretch;margin-top:2px}
  .dish{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .dish .pic{height:62px;background:linear-gradient(135deg,#f3e9d2,#e9dcbf)}
  .dish .bd{padding:8px 10px 10px}
  .dish .tag{display:inline-block;font-size:9.5px;font-weight:800;color:#8a5a1c;background:rgba(199,146,51,.16);padding:2px 7px;border-radius:20px;margin-bottom:4px}
  .dish .nm{font-size:13px;font-weight:700;line-height:1.2}
  .dish .pr{font-size:12.5px;font-weight:800;color:#7a4a24;margin-top:4px}
  #proc{position:absolute;inset:0;background:var(--card);display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:5}
  #proc.on{display:flex}
  .pstage{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
  .pstage .g1{position:absolute;width:200px;height:200px;border-radius:50%;background:conic-gradient(from 0deg,#c79233,#e6b95e,#7a4a24,#e3a23c,#f0d089,#c79233);filter:blur(22px);opacity:.72;animation:sp 3.4s linear infinite}
  .pstage .g2{position:absolute;width:160px;height:160px;border-radius:50%;background:conic-gradient(from 180deg,#7a4a24,#c79233,#f0d089,#c79233,#7a4a24);filter:blur(16px);opacity:.52;animation:spr 2.6s linear infinite}
  .pstage .core{position:absolute;width:88px;height:88px;border-radius:22px;background:var(--card);border:1px solid var(--line);z-index:1}
  .pstage .logo{width:70px;height:70px;border-radius:17px;background:#7a4a24;color:#f4ecdb;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;z-index:2;animation:br 2.6s ease-in-out infinite}
  .ptxt{font-size:16px;font-weight:700;min-height:24px;letter-spacing:.2px;transition:opacity .35s ease}
  @keyframes sp{to{transform:rotate(360deg)}}@keyframes spr{to{transform:rotate(-360deg)}}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
</head>
<body>
<p class="hint">Tap “✨ Find what's for me”, then a mood. Switch language in the bar — the question and moods follow.</p>
<div class="phone">
  <div class="hdr"><div class="mark">A</div><div><h1>Annapoorna · RS Puram</h1><div class="sub">AI Waiter — powered by Odysra</div></div></div>
  <div class="langbar" id="langbar"></div>
  <div id="chat"></div>
  <div id="proc"></div>
</div>
<script>
var LANGS=[["ta","தமிழ்"],["en","English"],["hi","हिन्दी"],["ml","മലയാളം"],["te","తెలుగు"],["kn","ಕನ್ನಡ"]];
var GREET={en:"Good evening! Welcome to Annapoorna — what are you in the mood for today?",ta:"வணக்கம்! அன்னபூர்ணாவிற்கு வரவேற்கிறோம் — இன்று என்ன சாப்பிட விரும்புகிறீர்கள்?",hi:"नमस्ते! अन्नपूर्णा में स्वागत है — आज क्या खाने का मन है?",ml:"സ്വാഗതം! അന്നപൂർണയിലേക്ക് — ഇന്ന് എന്ത് കഴിക്കാൻ തോന്നുന്നു?",te:"నమస్తే! అన్నపూర్ణకు స్వాగతం — ఈరోజు ఏం తినాలని ఉంది?",kn:"ನಮಸ್ಕಾರ! ಅನ್ನಪೂರ್ಣಗೆ ಸ್ವಾಗತ — ಇಂದು ಏನು ತಿನ್ನಬೇಕೆನಿಸುತ್ತದೆ?"};
var FINDQ={en:"What are you in the mood for today? Tell me, or tap one 😋",ta:"இன்று எதைச் சாப்பிட விரும்புகிறீர்கள்? சொல்லுங்கள் அல்லது தேர்வுசெய்யுங்கள் 😋",hi:"आज आपका क्या खाने का मन है? बताइए या एक चुनिए 😋",ml:"ഇന്ന് എന്ത് കഴിക്കാൻ തോന്നുന്നു? പറയൂ അല്ലെങ്കിൽ ഒന്ന് തിരഞ്ഞെടുക്കൂ 😋",te:"ఈరోజు ఏం తినాలని ఉంది? చెప్పండి లేదా ఒకటి ఎంచుకోండి 😋",kn:"ಇಂದು ಏನು ತಿನ್ನಬೇಕೆನಿಸುತ್ತದೆ? ಹೇಳಿ ಅಥವಾ ಒಂದನ್ನು ಆಯ್ಕೆಮಾಡಿ 😋"};
var INTRO={en:"Here's what I'd go for today — a nice mix across the menu 😋",ta:"இன்று நான் பரிந்துரைப்பது — மெனு முழுவதும் ஒரு கலவை 😋",hi:"आज के लिए मेरी पसंद — मेन्यू भर से एक मिश्रण 😋",ml:"ഇന്ന് ഞാൻ നിർദേശിക്കുന്നത് — മെനുവിലുടനീളം ഒരു മിശ്രിതം 😋",te:"ఈరోజుకి నా సూచనలు — మెనూ అంతటా ఒక మిశ్రమం 😋",kn:"ಇಂದಿಗೆ ನನ್ನ ಸಲಹೆ — ಮೆನು ಪೂರ್ತಿ ಒಂದು ಮಿಶ್ರಣ 😋"};
var CH={find:{en:"✨ Find what's for me",ta:"✨ எனக்கு ஏற்றதைக் கண்டுபிடி",hi:"✨ मेरे लिए ढूँढें",ml:"✨ എനിക്കുള്ളത് കണ്ടെത്തൂ",te:"✨ నాకోసం వెతకండి",kn:"✨ ನನಗಾಗಿ ಹುಡುಕಿ"},explore:{en:"🍽️ Explore menu",ta:"🍽️ மெனு",hi:"🍽️ मेन्यू",ml:"🍽️ മെനു",te:"🍽️ మెను",kn:"🍽️ ಮೆನು"},specials:{en:"⭐ Today's specials",ta:"⭐ ஸ்பெஷல்",hi:"⭐ स्पेशल",ml:"⭐ സ്പെഷ്യൽ",te:"⭐ స్పెషల్స్",kn:"⭐ ಸ್ಪೆಷಲ್"},back:{en:"← Back",ta:"← பின்",hi:"← पीछे",ml:"← പിന്നോട്ട്",te:"← వెనుకకు",kn:"← ಹಿಂದೆ"}};
var P=[{en:"Reading your taste…",ta:"உங்கள் ரசனையைப் படிக்கிறேன்…",hi:"आपका स्वाद समझ रहा हूँ…",ml:"നിങ്ങളുടെ രുചി വായിക്കുന്നു…",te:"మీ అభిరుచిని చదువుతున్నా…",kn:"ನಿಮ್ಮ ಅಭಿರುಚಿ ಓದುತ್ತಿದ್ದೇನೆ…"},{en:"Matching the menu…",ta:"மெனுவுடன் பொருத்துகிறேன்…",hi:"मेन्यू से मिला रहा हूँ…",ml:"മെനുവുമായി ചേർക്കുന്നു…",te:"మెనూతో సరిపోలుస్తున్నా…",kn:"ಮೆನುವಿನೊಂದಿಗೆ ಹೊಂದಿಸುತ್ತಿದ್ದೇನೆ…"},{en:"Picking the best dishes for you…",ta:"உங்களுக்கான சிறந்த உணவுகளைத் தேர்கிறேன்…",hi:"आपके लिए बेहतरीन व्यंजन चुन रहा हूँ…",ml:"നിങ്ങൾക്കായി മികച്ച വിഭവങ്ങൾ തിരഞ്ഞെടുക്കുന്നു…",te:"మీ కోసం ఉత్తమ వంటకాలు ఎంచుకుంటున్నా…",kn:"ನಿಮಗಾಗಿ ಅತ್ಯುತ್ತಮ ಖಾದ್ಯಗಳನ್ನು ಆರಿಸುತ್ತಿದ್ದೇನೆ…"}];
var MOODS=[{k:"light",lab:{en:"Something light",ta:"லேசானது",hi:"कुछ हल्का",ml:"ലഘുവായത്",te:"తేలికైనది",kn:"ಹಗುರವಾದದ್ದು"}},{k:"full",lab:{en:"A full meal",ta:"முழு உணவு",hi:"भरपूर भोजन",ml:"നിറഞ്ഞ ഭക്ഷണം",te:"పూర్తి భోజనం",kn:"ಪೂರ್ಣ ಊಟ"}},{k:"spicy",lab:{en:"Something spicy",ta:"காரமானது",hi:"कुछ तीखा",ml:"എരിവുള്ളത്",te:"కారంగా ఉండేది",kn:"ಖಾರವಾದದ್ದು"}},{k:"sweet",lab:{en:"Something sweet",ta:"இனிப்பானது",hi:"कुछ मीठा",ml:"മധുരമുള്ളത്",te:"తీపి ఏదైనా",kn:"ಸಿಹಿಯಾದದ್ದು"}},{k:"surprise",lab:{en:"Surprise me",ta:"ஆச்சரியப்படுத்து",hi:"सरप्राइज़ करें",ml:"അത്ഭുതപ്പെടുത്തൂ",te:"ఆశ్చర్యపరచండి",kn:"ಅಚ್ಚರಿ ಮಾಡಿ"}}];
var RECS={
 light:[["Idli","₹50",""],["Curd Rice","₹82",""],["Tomato Soup","₹100",""],["Filter Coffee","₹40",""]],
 full:[["South Indian Meals","₹180","BESTSELLER"],["Veg Biriyani","₹110",""],["Veg Fried Rice","₹175",""],["Paneer Butter Masala","₹235","MUST TRY"]],
 spicy:[["Chilli Parotta","₹110","BESTSELLER"],["Gobi Manchurian","₹165",""],["Chilli Paneer","₹245",""],["Hyderabadi Biriyani","₹190",""]],
 sweet:[["Gulab Jamun","₹60",""],["Rava Kesari","₹55",""],["Mango Milkshake","₹90",""],["Rose Milk","₹70",""]],
 surprise:[["Masala Dosa","₹70","BESTSELLER"],["Veg Fried Rice","₹175",""],["Paneer Tikka","₹245",""],["Gulab Jamun","₹60",""]]
};
var lang="en",chat=document.getElementById("chat"),proc=document.getElementById("proc");
function L(m){return (m[lang]||m.en);}
function bot(t){var d=document.createElement("div");d.className="msg bot";d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function me(t){var d=document.createElement("div");d.className="msg me";d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function chips(html){var d=document.createElement("div");d.className="chips";d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function mainChips(){chips('<button class="chip" onclick="alert(\'(menu)\')">'+L(CH.explore)+'</button><button class="chip" onclick="findForMe()">'+L(CH.find)+'</button><button class="chip alt" onclick="alert(\'(specials)\')">'+L(CH.specials)+'</button>');}
function findForMe(){bot(L(FINDQ));chips(MOODS.map(function(m){return '<button class="chip" onclick="moodPick(\''+m.k+'\')">'+L(m.lab)+'</button>';}).join("")+'<button class="chip alt" onclick="mainChips()">'+L(CH.back)+'</button>');}
function moodPick(k){var m=null;for(var i=0;i<MOODS.length;i++){if(MOODS[i].k===k)m=MOODS[i];}me(L(m.lab));processing(k);}
var _t=null;
function processing(k){var mi=0;proc.innerHTML='<div class="pstage"><span class="g1"></span><span class="g2"></span><span class="core"></span><div class="logo">A</div></div><div class="ptxt" id="ptxt">'+L(P[0])+'</div>';proc.classList.add("on");
  _t=setInterval(function(){var e=document.getElementById("ptxt");if(!e)return;e.style.opacity="0";setTimeout(function(){mi=(mi+1)%P.length;e.textContent=L(P[mi]);e.style.opacity="1";},340);},1500);
  setTimeout(function(){clearInterval(_t);proc.classList.remove("on");recs(k);},3400);}
function recs(k){bot(L(INTRO));var g=RECS[k].map(function(d){return '<div class="dish"><div class="pic"></div><div class="bd">'+(d[2]?'<div class="tag">★ '+d[2]+'</div>':'')+'<div class="nm">'+d[0]+'</div><div class="pr">'+d[1]+'</div></div></div>';}).join("");var w=document.createElement("div");w.className="rgrid";w.innerHTML=g;chat.appendChild(w);chat.scrollTop=chat.scrollHeight;mainChips();}
function setLang(c){lang=c;document.querySelectorAll("#langbar button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===c);});chat.innerHTML="";bot(L(GREET));mainChips();}
document.getElementById("langbar").innerHTML=LANGS.map(function(l){return '<button data-l="'+l[0]+'"'+(l[0]==="en"?' class="on"':'')+' onclick="setLang(\''+l[0]+'\')">'+l[1]+'</button>';}).join("");
bot(L(GREET));mainChips();
</script>
</body>
</html>
